<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<title>Vitrine 3D des objets</title>
<base href="../" />
<style>
  html, body { margin: 0; height: 100%; background: #12161c; color: #e8e4da; font: 13px system-ui, sans-serif; }
  #scene { position: fixed; inset: 0; }
  #legende { position: fixed; top: 8px; left: 10px; opacity: .8; pointer-events: none; }
</style>
</head>
<body>
<!--
  Outil d'atelier : pose tous les objets côte à côte, sur une table, sous la
  lumière de la classe. En volume ceux que objets-3d.js sait modeler ; à plat
  (leur photographie) tous les autres. Sert à juger la refonte 3D d'un coup d'œil.
  Ouvrir avec un serveur local : /outils/vitrine-3d.html
-->
<div id="scene"></div>
<div id="legende">Glisser pour tourner · molette pour approcher</div>
<script type="module">
import * as THREE from "./vendor/three.module.min.js";
import { creerAtelier, SORTES_3D } from "./src/features/objets-3d.js";
import { imageDetouree, TYPES } from "./src/features/affaires.js";

const hote = document.getElementById("scene");
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
hote.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color("#1a1f27");
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);
scene.add(new THREE.HemisphereLight("#fff4e0", "#3a2a1c", 0.9));
const soleil = new THREE.DirectionalLight("#ffe6c4", 2.2);
soleil.position.set(-4, 7, 5);
soleil.castShadow = true;
soleil.shadow.mapSize.set(2048, 2048);
Object.assign(soleil.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 });
scene.add(soleil);

const COLS = 8, PAS = 1.25;
const sortes = [...new Set([...TYPES, ...SORTES_3D])].sort();
const rangs = Math.ceil(sortes.length / COLS);
const table = new THREE.Mesh(new THREE.BoxGeometry(COLS * PAS + 0.6, 0.12, rangs * PAS + 0.6),
  new THREE.MeshStandardMaterial({ color: "#7a5434", roughness: .6 }));
table.position.y = -0.06; table.receiveShadow = true;
scene.add(table);

const atelier = creerAtelier(THREE);
const chargeur = new THREE.TextureLoader();
const etiquettes = [];
sortes.forEach((kind, i) => {
  const x = (i % COLS - (COLS - 1) / 2) * PAS;
  const z = (Math.floor(i / COLS) - (rangs - 1) / 2) * PAS;
  const vrai = atelier.modele(kind);
  if (vrai) {
    vrai.position.set(x, 0.004, z);
    scene.add(vrai);
  } else {
    chargeur.load(imageDetouree(kind), (t) => {
      t.colorSpace = THREE.SRGBColorSpace;
      const ratio = t.image.height / t.image.width;
      const m = new THREE.Mesh(new THREE.PlaneGeometry(1, 1),
        new THREE.MeshStandardMaterial({ map: t, transparent: true, alphaTest: .35, roughness: .65 }));
      m.scale.set(0.7, 0.7 * ratio, 1);
      m.rotation.x = -Math.PI / 2;
      m.position.set(x, 0.012, z);
      m.castShadow = true;
      scene.add(m);
    });
  }
  etiquettes.push({ kind, pos: new THREE.Vector3(x, 0, z + 0.5), vrai: Boolean(vrai) });
});

// Les noms, sous chaque objet ; en orange, ceux qui ne sont qu'une photo à plat.
const calque = document.createElement("div");
calque.style.cssText = "position:fixed;inset:0;pointer-events:none";
document.body.appendChild(calque);
const noms = etiquettes.map((e) => {
  const s = document.createElement("span");
  s.textContent = e.kind;
  s.style.cssText = `position:absolute;transform:translate(-50%,0);font-size:11px;white-space:nowrap;color:${e.vrai ? "#cfe3ff" : "#ffb070"}`;
  calque.appendChild(s);
  return s;
});

let theta = 0.0, phi = 0.95, rayon = 13;
const cible = new THREE.Vector3();
let glisse = null;
addEventListener("pointerdown", (e) => { glisse = { x: e.clientX, y: e.clientY, t: theta, p: phi }; });
addEventListener("pointerup", () => { glisse = null; });
addEventListener("pointermove", (e) => {
  if (!glisse) return;
  theta = glisse.t - (e.clientX - glisse.x) * 0.006;
  phi = Math.max(0.15, Math.min(1.45, glisse.p - (e.clientY - glisse.y) * 0.006));
});
addEventListener("wheel", (e) => { rayon = Math.max(2, Math.min(25, rayon * (1 + e.deltaY * 0.001))); });

function boucle() {
  const l = hote.clientWidth, h = hote.clientHeight;
  if (renderer.domElement.width !== Math.floor(l * renderer.getPixelRatio())) {
    renderer.setSize(l, h); camera.aspect = l / h; camera.updateProjectionMatrix();
  }
  camera.position.set(cible.x + Math.sin(theta) * Math.sin(phi) * rayon, cible.y + Math.cos(phi) * rayon, cible.z + Math.cos(theta) * Math.sin(phi) * rayon);
  camera.lookAt(cible);
  renderer.render(scene, camera);
  etiquettes.forEach((e, i) => {
    const p = e.pos.clone().project(camera);
    noms[i].style.left = `${(p.x + 1) / 2 * l}px`;
    noms[i].style.top = `${(1 - p.y) / 2 * h}px`;
  });
  requestAnimationFrame(boucle);
}
boucle();
window.__vitrine = {
  scene, camera,
  regarder: (t, p, r) => { cible.set(0, 0, 0); theta = t; phi = p; rayon = r; },
  // Une planche : chaque objet vu de près, assemblés dans une seule image.
  planche: (t = 0.6, p = 1.0, r = 1.6, cote = 180, cols = 8) => {
    const toile = document.createElement("canvas");
    toile.width = cols * cote; toile.height = Math.ceil(etiquettes.length / cols) * cote;
    const g = toile.getContext("2d");
    g.fillStyle = "#12161c"; g.fillRect(0, 0, toile.width, toile.height);
    const avant = renderer.getSize(new THREE.Vector2());
    renderer.setPixelRatio(1); renderer.setSize(cote, cote, false);
    camera.aspect = 1; camera.updateProjectionMatrix();
    etiquettes.forEach((e, i) => {
      cible.set(e.pos.x, 0.1, e.pos.z - 0.5);
      camera.position.set(cible.x + Math.sin(t) * Math.sin(p) * r, cible.y + Math.cos(p) * r, cible.z + Math.cos(t) * Math.sin(p) * r);
      camera.lookAt(cible);
      renderer.render(scene, camera);
      g.drawImage(renderer.domElement, (i % cols) * cote, Math.floor(i / cols) * cote);
      g.fillStyle = "#e8e4da"; g.font = "13px sans-serif";
      g.fillText(e.kind, (i % cols) * cote + 6, Math.floor(i / cols) * cote + 16);
    });
    renderer.setSize(avant.x, avant.y);
    return toile.toDataURL("image/png");
  },
  // Cadrer un objet de près : voir("montre", 0.6, 1.0, 1.6)
  voir: (kind, t = 0.5, p = 1.0, r = 1.8) => {
    const e = etiquettes.find((x) => x.kind === kind);
    if (e) { cible.set(e.pos.x, 0.12, e.pos.z - 0.5); theta = t; phi = p; rayon = r; }
  }
};
</script>
</body>
</html>
