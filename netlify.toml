# ---------------------------------------------------------------------------
# OJM ACADEMY — déploiement Netlify
#
# Site entièrement statique : rien à compiler, on publie le dossier tel quel.
# ---------------------------------------------------------------------------

[build]
  publish = "."
  # Le site n'a rien à compiler. Cette unique étape dépose les identifiants
  # Supabase, pris dans les variables d'environnement du projet, dans le
  # config.js que le navigateur ira lire. Sans elle, les variables ne
  # serviraient à rien : un site statique ne lit pas l'environnement.
  # Sans variables, elle ne touche à rien et le config.js du dépôt reste.
  command = "node outils/config-depuis-env.mjs"

# --- Ce qui n'a rien à faire en ligne ---------------------------------------
# On publie le dossier tel quel, donc tout ce qui traîne à côté du site serait
# servi aussi : migrations SQL, documentation, outils de construction. Rien de
# secret — le dépôt est public — mais un site n'a pas à exposer son atelier.
[[redirects]]
  from = "/supabase/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/docs/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/outils/*"
  to = "/index.html"
  status = 404

[[redirects]]
  from = "/.github/*"
  to = "/index.html"
  status = 404

# --- En-têtes de sécurité ---------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # La politique de contenu autorise exactement ce dont le site se sert :
    #  · scripts : uniquement les fichiers du site (aucun script en ligne)
    #  · styles  : le site + Google Fonts, et les attributs style= de l'interface
    #  · images  : le site, les captures de tableau (data:) et les fichiers
    #              téléchargés depuis le stockage (blob:, https:)
    #  · connect : Supabase en REST et en WebSocket
    #  · worker  : le moteur pdf.js, chargé en blob:
    #  · frame   : l'aperçu d'un document servi par une URL signée Supabase
    # Sur une seule ligne : Netlify n'accepte pas de retour à la ligne dans
    # une valeur d'en-tête. Écrite en bloc, la politique arrivait tronquée —
    # style-src disparaissait, les styles en ligne de l'interface étaient
    # refusés, et la page s'affichait vide.
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'self'; script-src 'self' https://esm.sh; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://esm.sh blob: data:; worker-src 'self' blob:; child-src 'self' blob: https://*.supabase.co; frame-src 'self' blob: https://*.supabase.co; manifest-src 'self'"

# Les bibliothèques embarquées portent leur version : cache long.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# La configuration doit pouvoir changer sans attendre l'expiration d'un cache.
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
