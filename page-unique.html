<style>
/* ---- tokens.css ---- */
/* ===========================================================================
   OJM ACADEMY — Jetons de design
   Registre visuel : institutionnel, militaire, scolaire. Encre, laiton, olive,
   parchemin. Pas de dégradés décoratifs, pas de cartes surdimensionnées.
   ========================================================================= */

:root {
  /* --- Encre (chrome de l'application) ------------------------------------ */
  --encre-1000: #080a0c;
  --encre-900:  #0d1013;
  --encre-850:  #11151a;
  --encre-800:  #161b21;
  --encre-700:  #1d242b;
  --encre-600:  #273038;
  --encre-500:  #35414b;
  --encre-400:  #4a5865;

  /* --- Parchemin (surfaces de travail : cahiers, documents) --------------- */
  --parch-100: #faf5ea;
  --parch-200: #f3ead9;
  --parch-300: #e8dcc4;
  --parch-400: #d6c6a8;
  --parch-encre: #2a2620;

  /* --- Accents ------------------------------------------------------------ */
  --laiton:     #c9a227;
  --laiton-sombre: #9a7b1c;
  --laiton-clair:  #e2c25c;
  --olive:      #7d8c58;
  --olive-sombre: #5c6840;
  --oxblood:    #9c4a44;
  --ardoise:    #4f6d7a;
  --pourpre:    #6b5b8f;

  /* --- Sémantique --------------------------------------------------------- */
  --ok:      #6f9c6a;
  --attn:    #c9963f;
  --alerte:  #b4554e;
  --info:    #5b829c;

  /* --- Texte -------------------------------------------------------------- */
  --texte:        #e6e2d8;
  --texte-doux:   #a9a396;
  --texte-faible: #746e63;
  --texte-inverse:#1a1d21;

  /* --- Lignes et fonds ---------------------------------------------------- */
  --ligne:        #262e36;
  --ligne-forte:  #38424c;
  --ligne-laiton: rgba(201, 162, 39, .34);
  --voile:        rgba(8, 10, 12, .72);

  /* --- Typographie -------------------------------------------------------- */
  --f-titre: "Spectral", "Iowan Old Style", Georgia, serif;
  --f-ui:    "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:  "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;

  --t-xs:  .6875rem;
  --t-sm:  .78125rem;
  --t-md:  .875rem;
  --t-lg:  1rem;
  --t-xl:  1.1875rem;
  --t-2xl: 1.5rem;
  --t-3xl: 2rem;

  /* --- Espacements -------------------------------------------------------- */
  --e-1: 4px;
  --e-2: 8px;
  --e-3: 12px;
  --e-4: 16px;
  --e-5: 24px;
  --e-6: 32px;
  --e-7: 48px;

  /* --- Rayons et ombres --------------------------------------------------- */
  --r-xs: 2px;
  --r-sm: 3px;
  --r-md: 5px;
  --r-lg: 8px;
  --ombre-1: 0 1px 2px rgba(0,0,0,.4);
  --ombre-2: 0 4px 14px rgba(0,0,0,.36);
  --ombre-3: 0 18px 48px rgba(0,0,0,.5);

  /* --- Mesures du châssis ------------------------------------------------- */
  --h-barre: 52px;
  --l-rail: 232px;
  --l-panneau: 320px;

  --transition: 140ms cubic-bezier(.4, 0, .2, 1);
}

/* --- Densités pour cohabiter avec la fenêtre Roblox ----------------------- */
:root[data-density="moyen"]   { --h-barre: 46px; --l-rail: 196px; --t-md: .84rem; }
:root[data-density="compact"] { --h-barre: 40px; --l-rail: 60px;  --t-md: .82rem; --e-5: 16px; --e-6: 20px; }
:root[data-density="minimal"] { --h-barre: 34px; --l-rail: 0px;   --t-md: .8rem;  --e-5: 12px; --e-6: 16px; }

/* --- Thème clair (salle éclairée) ---------------------------------------- */
:root[data-theme="jour"] {
  --encre-1000: #d8d2c4;
  --encre-900:  #e6e0d2;
  --encre-850:  #ece6da;
  --encre-800:  #f2ece1;
  --encre-700:  #f7f2e9;
  --encre-600:  #e4ddcf;
  --encre-500:  #cfc6b4;
  --encre-400:  #b3a995;

  --texte:        #23211c;
  --texte-doux:   #565146;
  --texte-faible: #837c6e;
  --texte-inverse:#f7f2e9;

  --ligne:        #d5cdbb;
  --ligne-forte:  #bdb3a0;
  --voile:        rgba(40, 36, 28, .5);
  --laiton:       #8a6d12;
  --laiton-clair: #a8871f;
  --ombre-2: 0 4px 14px rgba(60,52,32,.16);
  --ombre-3: 0 18px 48px rgba(60,52,32,.22);
}

/* --- Couleurs des repères de tranche et des pense-bêtes ------------------- */
:root {
  --repere-rouge:  #c05a52;
  --repere-bleu:   #5b829c;
  --repere-vert:   #7d9c6a;
  --repere-jaune:  #d8bd63;
  --repere-violet: #8d7bb0;
}

/* ---- base.css ---- */
/* ===========================================================================
   Réinitialisation et éléments de base
   ========================================================================= */

*, *::before, *::after { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  background: var(--encre-900);
  color: var(--texte);
  font-family: var(--f-ui);
  font-size: var(--t-md);
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overscroll-behavior: none;
}

h1, h2, h3, h4 {
  font-family: var(--f-titre);
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0;
  line-height: 1.25;
}
h1 { font-size: var(--t-3xl); }
h2 { font-size: var(--t-2xl); }
h3 { font-size: var(--t-xl); }
h4 { font-size: var(--t-lg); }

p  { margin: 0 0 var(--e-3); }
a  { color: var(--laiton-clair); text-decoration: none; }
a:hover { text-decoration: underline; }

button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

hr {
  border: 0;
  border-top: 1px solid var(--ligne);
  margin: var(--e-5) 0;
}

code, kbd, .mono { font-family: var(--f-mono); font-size: .92em; }

kbd {
  background: var(--encre-700);
  border: 1px solid var(--ligne-forte);
  border-bottom-width: 2px;
  border-radius: var(--r-sm);
  padding: 1px 5px;
  font-size: var(--t-xs);
}

::selection { background: rgba(201,162,39,.3); }

:focus-visible {
  outline: 2px solid var(--laiton);
  outline-offset: 2px;
  border-radius: var(--r-xs);
}

/* Barres de défilement discrètes */
* { scrollbar-width: thin; scrollbar-color: var(--encre-500) transparent; }
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb {
  background: var(--encre-500);
  border-radius: 9px;
  border: 2px solid transparent;
  background-clip: content-box;
}
*::-webkit-scrollbar-thumb:hover { background: var(--encre-400); background-clip: content-box; }

.skip-link {
  position: absolute; left: -999px; top: 0; z-index: 999;
  background: var(--laiton); color: var(--texte-inverse);
  padding: var(--e-2) var(--e-4); border-radius: 0 0 var(--r-md) 0;
}
.skip-link:focus { left: 0; }

[hidden] { display: none !important; }

.invisible {
  position: absolute; width: 1px; height: 1px;
  padding: 0; margin: -1px; overflow: hidden;
  clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* --- Écran d'amorçage ---------------------------------------------------- */
.boot {
  position: fixed; inset: 0; z-index: 500;
  display: grid; place-content: center; justify-items: center; gap: var(--e-4);
  background: var(--encre-900);
}
.boot__mark {
  font-family: var(--f-titre); font-size: 2.6rem; font-weight: 700;
  letter-spacing: .22em; color: var(--laiton);
  border: 2px solid var(--ligne-laiton);
  padding: var(--e-3) var(--e-5) var(--e-3) calc(var(--e-5) + .22em);
  border-radius: var(--r-sm);
  animation: pulsation 2.2s ease-in-out infinite;
}
.boot__label { color: var(--texte-faible); font-size: var(--t-sm); letter-spacing: .08em; text-transform: uppercase; }
@keyframes pulsation { 0%,100% { opacity: .55 } 50% { opacity: 1 } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .01ms !important;
  }
}

/* ---- layout.css ---- */
/* ===========================================================================
   Châssis de l'application : barre, rail de navigation, vue, panneau
   ========================================================================= */

.chassis {
  display: grid;
  grid-template-columns: var(--l-rail) minmax(0, 1fr);
  grid-template-rows: var(--h-barre) minmax(0, 1fr);
  grid-template-areas: "marque barre" "rail vue";
  height: 100dvh;
  background: var(--encre-900);
}

/* --- Bloc marque --------------------------------------------------------- */
.marque {
  grid-area: marque;
  display: flex; align-items: center; gap: var(--e-3);
  padding: 0 var(--e-4);
  background: var(--encre-850);
  border-right: 1px solid var(--ligne);
  border-bottom: 1px solid var(--ligne);
  overflow: hidden;
}
.marque__sceau {
  flex: 0 0 auto;
  width: 26px; height: 26px;
  display: grid; place-content: center;
  border: 1.5px solid var(--ligne-laiton);
  border-radius: var(--r-sm);
  color: var(--laiton);
  font-family: var(--f-titre); font-size: .68rem; font-weight: 700; letter-spacing: .04em;
}
.marque__nom {
  font-family: var(--f-titre); font-size: var(--t-md); font-weight: 600;
  letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.marque__devise {
  display: block; font-family: var(--f-ui); font-size: 9px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--texte-faible);
}

/* --- Barre supérieure ---------------------------------------------------- */
.barre {
  grid-area: barre;
  display: flex; align-items: center; gap: var(--e-2);
  padding: 0 var(--e-3) 0 var(--e-4);
  background: var(--encre-850);
  border-bottom: 1px solid var(--ligne);
}
.barre__fil {
  display: flex; align-items: center; gap: var(--e-2);
  font-size: var(--t-sm); color: var(--texte-doux);
  min-width: 0; flex: 1;
}
.barre__fil b { color: var(--texte); font-weight: 600; }
.barre__fil span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.barre__sep { color: var(--texte-faible); }
.barre__outils { display: flex; align-items: center; gap: var(--e-1); flex: 0 0 auto; }

/* --- Rail de navigation -------------------------------------------------- */
.rail {
  grid-area: rail;
  display: flex; flex-direction: column;
  background: var(--encre-850);
  border-right: 1px solid var(--ligne);
  overflow-y: auto; overflow-x: hidden;
  padding: var(--e-3) 0 var(--e-4);
}
.rail__titre {
  padding: var(--e-4) var(--e-4) var(--e-2);
  font-size: 9.5px; letter-spacing: .16em; text-transform: uppercase;
  color: var(--texte-faible); font-weight: 600;
}
.rail__lien {
  display: flex; align-items: center; gap: var(--e-3);
  padding: 7px var(--e-4);
  color: var(--texte-doux); font-size: var(--t-md);
  border-left: 2px solid transparent;
  transition: background var(--transition), color var(--transition);
  white-space: nowrap;
}
.rail__lien:hover { background: var(--encre-800); color: var(--texte); text-decoration: none; }
.rail__lien[aria-current="page"] {
  background: var(--encre-800); color: var(--texte);
  border-left-color: var(--laiton);
}
.rail__lien svg { flex: 0 0 auto; width: 16px; height: 16px; opacity: .85; }
.rail__lien .compteur {
  margin-left: auto; font-size: var(--t-xs); font-family: var(--f-mono);
  background: var(--encre-600); color: var(--texte-doux);
  padding: 0 5px; border-radius: 999px;
}
.rail__pied { margin-top: auto; padding: var(--e-3) var(--e-4) 0; }

/* --- Vue principale ------------------------------------------------------ */
.vue {
  grid-area: vue;
  overflow: auto;
  position: relative;
  display: flex; flex-direction: column;
  min-width: 0;
}
.vue--pleine { overflow: hidden; }

.page {
  padding: var(--e-6) var(--e-6) var(--e-7);
  max-width: 1180px; width: 100%; margin: 0 auto;
  flex: 1;
}
.page--large { max-width: none; }

.page__entete {
  display: flex; align-items: flex-end; justify-content: space-between;
  gap: var(--e-4); flex-wrap: wrap;
  padding-bottom: var(--e-4);
  border-bottom: 1px solid var(--ligne);
  margin-bottom: var(--e-5);
}
.page__titre { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.page__titre h1 { overflow-wrap: anywhere; }
.page__surtitre {
  font-size: var(--t-xs); letter-spacing: .18em; text-transform: uppercase;
  color: var(--laiton); font-weight: 600;
}
.page__sous { color: var(--texte-doux); font-size: var(--t-sm); }
.page__actions { display: flex; gap: var(--e-2); flex-wrap: wrap; }

/* --- Grilles ------------------------------------------------------------- */
.grille { display: grid; gap: var(--e-4); }
.grille--2 { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.grille--3 { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
.grille--4 { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
.grille--fixe2 { grid-template-columns: 1fr 1fr; }

.colonnes {
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--l-panneau);
  gap: var(--e-5);
  align-items: start;
}

/* --- Panneau latéral contextuel ------------------------------------------ */
.panneau {
  background: var(--encre-850);
  border: 1px solid var(--ligne);
  border-radius: var(--r-md);
  overflow: hidden;
}
.panneau__entete {
  display: flex; align-items: center; justify-content: space-between; gap: var(--e-2);
  padding: var(--e-3) var(--e-4);
  border-bottom: 1px solid var(--ligne);
  background: var(--encre-800);
}
.panneau__titre {
  font-size: var(--t-xs); letter-spacing: .14em; text-transform: uppercase;
  color: var(--texte-doux); font-weight: 600;
}
.panneau__corps { padding: var(--e-4); }
.panneau__corps--serre { padding: 0; }
.panneau__liste { max-height: 420px; overflow-y: auto; }

/* --- Mode cohabitation Roblox -------------------------------------------- */
:root[data-density="compact"] .marque__nom,
:root[data-density="compact"] .rail__lien span:not(.compteur),
:root[data-density="compact"] .rail__titre { display: none; }
:root[data-density="compact"] .rail__lien { justify-content: center; padding: 10px 0; }
:root[data-density="compact"] .marque { justify-content: center; padding: 0; }
:root[data-density="compact"] .page { padding: var(--e-4); }

:root[data-density="minimal"] .chassis {
  grid-template-columns: 1fr;
  grid-template-areas: "barre" "vue";
}
:root[data-density="minimal"] .marque,
:root[data-density="minimal"] .rail { display: none; }
:root[data-density="minimal"] .page { padding: var(--e-3); }

/* Fenêtre flottante « cahier à côté de Roblox » */
body.est-flottant .chassis {
  border: 1px solid var(--ligne-laiton);
  border-radius: var(--r-lg);
  overflow: hidden;
  box-shadow: var(--ombre-3);
}

/* --- Hors session : le châssis s'efface au profit de l'écran d'accès ------- */
body.hors-session .chassis {
  grid-template-columns: 1fr;
  /* Les lignes aussi : sans cette remise à plat, la zone « vue » retombait
     dans la première piste — celle de la barre, haute de 52 px — et l'écran
     d'accès s'y retrouvait rogné par son propre overflow. */
  grid-template-rows: minmax(0, 1fr);
  grid-template-areas: "vue";
}
body.hors-session .marque,
body.hors-session .rail,
body.hors-session .barre { display: none; }

.accueil-acces {
  min-height: 100dvh;
  display: grid;
  grid-template-columns: 1.05fr .95fr;
  background: var(--encre-900);
}
.acces__enseigne {
  display: flex; flex-direction: column; justify-content: center; gap: var(--e-5);
  padding: var(--e-7);
  background:
    radial-gradient(circle at 28% 22%, rgba(201,162,39,.08), transparent 55%),
    linear-gradient(160deg, var(--encre-850), var(--encre-1000));
  border-right: 1px solid var(--ligne-laiton);
}
.acces__sceau {
  width: 84px; height: 84px;
  display: grid; place-content: center;
  border: 2px solid var(--ligne-laiton); border-radius: var(--r-md);
  font-family: var(--f-titre); font-size: 1.6rem; font-weight: 700;
  letter-spacing: .14em; color: var(--laiton);
}
.acces__titre { font-size: 2.4rem; line-height: 1.1; }
.acces__devise {
  font-size: var(--t-xs); letter-spacing: .24em; text-transform: uppercase; color: var(--laiton);
}
.acces__points { display: grid; gap: var(--e-3); max-width: 46ch; }
.acces__point { display: flex; gap: var(--e-3); align-items: flex-start; font-size: var(--t-sm); color: var(--texte-doux); }
.acces__point svg { flex: 0 0 auto; margin-top: 2px; color: var(--laiton); }

.acces__formulaire {
  display: flex; flex-direction: column; justify-content: center;
  padding: var(--e-7) var(--e-6);
  overflow-y: auto;
}
.acces__boite { width: min(400px, 100%); margin: 0 auto; }

@media (max-width: 900px) {
  .accueil-acces { grid-template-columns: 1fr; }
  .acces__enseigne { display: none; }
  .acces__formulaire { padding: var(--e-5) var(--e-4); }
}

/* --- La fenêtre d'à-côté ---------------------------------------------------
   Petite, posée au-dessus du jeu. Chaque pixel compte : on retire le liseré
   d'origine, on supprime le bloc de marque, et la barre prend toute la
   largeur. Le rail reste une colonne d'icônes — jamais un tiroir : dans une
   fenêtre qu'on consulte d'un coup d'œil, un menu à ouvrir est un menu qu'on
   n'ouvre pas. La densité est forcée à « compact » à l'ouverture, ce qui le
   réduit à 60 px. */
body.est-flottant {
  margin: 0;
  overflow: hidden;
}
body.est-flottant .chassis {
  border: 0;
  border-radius: 0;
  box-shadow: none;
  height: 100dvh;
  grid-template-columns: var(--l-rail) minmax(0, 1fr);
  grid-template-rows: var(--h-barre) minmax(0, 1fr);
  grid-template-areas: "barre barre" "rail vue";
}
body.est-flottant .marque { display: none; }
body.est-flottant .bouton-tiroir { display: none; }
body.est-flottant .page { padding: var(--e-3) var(--e-3) var(--e-5); }
body.est-flottant .page__entete { flex-direction: column; align-items: stretch; }
body.est-flottant .btn { min-height: 34px; }
body.est-flottant .calque-toasts { left: var(--e-2); right: var(--e-2); max-width: none; }
body.est-flottant .barre { padding: 0 var(--e-2); }
body.est-flottant .barre__fil { font-size: var(--t-xs); }

/* En bandeau, la hauteur est la ressource rare : on rend au contenu tout ce
   que l'habillage peut céder, sans jamais retirer le titre — c'est lui qui dit
   où l'on est quand la fenêtre ne montre que quelques lignes. */
@media (max-height: 460px) {
  body.est-flottant .page { padding: var(--e-2) var(--e-2) var(--e-4); }
  body.est-flottant .page__entete {
    margin-bottom: var(--e-3);
    padding-bottom: var(--e-2);
  }
  body.est-flottant .page__titre h1 { font-size: var(--t-xl); }
  body.est-flottant .page__surtitre,
  body.est-flottant .page__sous { display: none; }
  body.est-flottant .parchemin { min-height: 0; padding-top: var(--e-3); }
  body.est-flottant .parchemin__corps { min-height: 140px; }
  body.est-flottant .feuillet__zone { padding: var(--e-2); }
}

/* ---- components.css ---- */
/* ===========================================================================
   Composants
   ========================================================================= */

/* --- Boutons -------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--e-2);
  padding: 6px var(--e-3);
  min-height: 32px;
  background: var(--encre-700);
  color: var(--texte);
  border: 1px solid var(--ligne-forte);
  border-radius: var(--r-sm);
  font-size: var(--t-sm); font-weight: 500;
  transition: background var(--transition), border-color var(--transition), color var(--transition);
  white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--encre-600); border-color: var(--encre-400); }
.btn:active:not(:disabled) { transform: translateY(.5px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn svg { width: 15px; height: 15px; }

.btn--primaire {
  background: var(--laiton); border-color: var(--laiton-sombre); color: #1a1508; font-weight: 600;
}
.btn--primaire:hover:not(:disabled) { background: var(--laiton-clair); border-color: var(--laiton); }

.btn--fantome { background: transparent; border-color: transparent; color: var(--texte-doux); }
.btn--fantome:hover:not(:disabled) { background: var(--encre-700); color: var(--texte); }

.btn--contour { background: transparent; }

.btn--danger { color: var(--alerte); border-color: rgba(180,85,78,.4); }
.btn--danger:hover:not(:disabled) { background: rgba(180,85,78,.14); border-color: var(--alerte); }

.btn--succes { background: var(--olive-sombre); border-color: var(--olive); color: #eef2e4; }
.btn--succes:hover:not(:disabled) { background: var(--olive); }

.btn--icone { padding: 0; width: 32px; min-height: 32px; }
.btn--grand { min-height: 40px; padding: 8px var(--e-5); font-size: var(--t-md); }
.btn--bloc { width: 100%; }
.btn--menu { justify-content: flex-start; width: 100%; border-radius: 0; border: 0; padding: 7px var(--e-3); }
.btn--menu:hover { background: var(--encre-700); }

.groupe-btn { display: inline-flex; }
.groupe-btn .btn { border-radius: 0; margin-left: -1px; }
.groupe-btn .btn:first-child { border-radius: var(--r-sm) 0 0 var(--r-sm); margin-left: 0; }
.groupe-btn .btn:last-child  { border-radius: 0 var(--r-sm) var(--r-sm) 0; }
.groupe-btn .btn[aria-pressed="true"] {
  background: var(--encre-600); border-color: var(--laiton); color: var(--laiton-clair); z-index: 1;
}

/* --- Champs --------------------------------------------------------------- */
.champ { display: flex; flex-direction: column; gap: 5px; margin-bottom: var(--e-4); }
.champ__label {
  font-size: var(--t-xs); letter-spacing: .1em; text-transform: uppercase;
  color: var(--texte-doux); font-weight: 600;
}
.champ__aide { font-size: var(--t-xs); color: var(--texte-faible); }
.champ__erreur { font-size: var(--t-xs); color: var(--alerte); }

.saisie, .zone, select.saisie {
  width: 100%;
  background: var(--encre-900);
  border: 1px solid var(--ligne-forte);
  border-radius: var(--r-sm);
  padding: 7px var(--e-3);
  color: var(--texte);
  transition: border-color var(--transition), background var(--transition);
}
.saisie:focus, .zone:focus { outline: none; border-color: var(--laiton); background: var(--encre-850); }
.saisie::placeholder, .zone::placeholder { color: var(--texte-faible); }
.zone { resize: vertical; min-height: 84px; line-height: 1.6; }
select.saisie { appearance: none; padding-right: var(--e-5);
  background-image: linear-gradient(45deg, transparent 50%, var(--texte-doux) 50%),
                    linear-gradient(135deg, var(--texte-doux) 50%, transparent 50%);
  background-position: calc(100% - 15px) 14px, calc(100% - 10px) 14px;
  background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }

.saisie--code {
  font-family: var(--f-mono); font-size: var(--t-2xl); letter-spacing: .28em;
  text-align: center; text-transform: uppercase; padding: var(--e-3);
}

.case { display: flex; align-items: flex-start; gap: var(--e-2); cursor: pointer; margin-bottom: var(--e-2); }
.case input { margin-top: 3px; accent-color: var(--laiton); flex: 0 0 auto; }
.case span { font-size: var(--t-sm); }

.rangee { display: flex; gap: var(--e-3); }
.rangee > * { flex: 1; min-width: 0; }

/* --- Cartes --------------------------------------------------------------- */
.carte {
  background: var(--encre-850);
  border: 1px solid var(--ligne);
  border-radius: var(--r-md);
  padding: var(--e-4);
  transition: border-color var(--transition), background var(--transition);
}
.carte--cliquable { cursor: pointer; display: block; color: inherit; }
.carte--cliquable:hover { border-color: var(--ligne-forte); background: var(--encre-800); text-decoration: none; }
.carte__entete { display: flex; align-items: flex-start; gap: var(--e-3); margin-bottom: var(--e-3); }
.carte__titre { font-family: var(--f-titre); font-size: var(--t-lg); font-weight: 600; }
.carte__meta { font-size: var(--t-xs); color: var(--texte-faible); }
.carte__pied {
  margin-top: var(--e-3); padding-top: var(--e-3);
  border-top: 1px solid var(--ligne);
  display: flex; align-items: center; gap: var(--e-3);
  font-size: var(--t-xs); color: var(--texte-faible);
}

/* Bandeau de couleur des classes */
.carte--classe { position: relative; padding-left: calc(var(--e-4) + 3px); }
.carte--classe::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  border-radius: var(--r-md) 0 0 var(--r-md); background: var(--teinte, var(--olive));
}
[data-teinte="olive"]   { --teinte: #7d8c58; }
[data-teinte="laiton"]  { --teinte: #c9a227; }
[data-teinte="ardoise"] { --teinte: #4f6d7a; }
[data-teinte="oxblood"] { --teinte: #9c4a44; }
[data-teinte="pourpre"] { --teinte: #6b5b8f; }
[data-teinte="encre"]   { --teinte: #4a5865; }

/* --- Étiquettes ----------------------------------------------------------- */
.etiq {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 1px 7px; border-radius: var(--r-xs);
  font-size: var(--t-xs); font-weight: 600; letter-spacing: .04em;
  background: var(--encre-700); color: var(--texte-doux);
  border: 1px solid var(--ligne);
  white-space: nowrap;
}
.etiq--laiton  { background: rgba(201,162,39,.14); color: var(--laiton-clair); border-color: var(--ligne-laiton); }
.etiq--ok      { background: rgba(111,156,106,.14); color: var(--ok); border-color: rgba(111,156,106,.3); }
.etiq--attn    { background: rgba(201,150,63,.14); color: var(--attn); border-color: rgba(201,150,63,.3); }
.etiq--alerte  { background: rgba(180,85,78,.14); color: var(--alerte); border-color: rgba(180,85,78,.3); }
.etiq--info    { background: rgba(91,130,156,.14); color: var(--info); border-color: rgba(91,130,156,.3); }
.etiq--direct  { background: rgba(180,85,78,.18); color: #d9756c; border-color: rgba(180,85,78,.4); }
.etiq--direct::before {
  content: ""; width: 6px; height: 6px; border-radius: 50%;
  background: currentColor; animation: battement 1.6s ease-in-out infinite;
}
@keyframes battement { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

/* --- Code de classe ------------------------------------------------------- */
.code-classe {
  display: inline-flex; align-items: center; gap: var(--e-2);
  font-family: var(--f-mono); font-size: var(--t-xl); font-weight: 600;
  letter-spacing: .18em; color: var(--laiton-clair);
  background: var(--encre-900);
  border: 1px dashed var(--ligne-laiton);
  border-radius: var(--r-sm);
  padding: var(--e-2) var(--e-4);
}
.code-classe--grand { font-size: var(--t-3xl); padding: var(--e-3) var(--e-5); }

/* --- Pastilles de présence ------------------------------------------------ */
.pastille { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: var(--texte-faible); }
.pastille--present { background: var(--ok); box-shadow: 0 0 0 2px rgba(111,156,106,.18); }
.pastille--away    { background: var(--attn); }
.pastille--absent  { background: var(--alerte); }
.pastille--offline { background: var(--encre-400); }

/* --- Listes --------------------------------------------------------------- */
.liste { display: flex; flex-direction: column; }
.liste__item {
  display: flex; align-items: center; gap: var(--e-3);
  padding: var(--e-3) var(--e-4);
  border-bottom: 1px solid var(--ligne);
  font-size: var(--t-sm);
  transition: background var(--transition);
  color: inherit;
}
.liste__item:last-child { border-bottom: 0; }
a.liste__item:hover, .liste__item--cliquable:hover { background: var(--encre-800); text-decoration: none; cursor: pointer; }
.liste__item[aria-current="true"] { background: var(--encre-800); box-shadow: inset 2px 0 0 var(--laiton); }
.liste__principal { flex: 1; min-width: 0; }
.liste__nom { color: var(--texte); font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.liste__detail { font-size: var(--t-xs); color: var(--texte-faible); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.liste__fin { flex: 0 0 auto; display: flex; align-items: center; gap: var(--e-2); }

/* --- Avatar --------------------------------------------------------------- */
.avatar {
  width: 28px; height: 28px; border-radius: var(--r-sm); flex: 0 0 auto;
  display: grid; place-content: center;
  background: var(--encre-600); color: var(--texte-doux);
  font-size: var(--t-xs); font-weight: 700; letter-spacing: .02em;
  border: 1px solid var(--ligne-forte);
  object-fit: cover; overflow: hidden;
}
.avatar--grand { width: 52px; height: 52px; font-size: var(--t-lg); border-radius: var(--r-md); }
.avatar--prof { border-color: var(--ligne-laiton); color: var(--laiton-clair); }

/* --- État vide ------------------------------------------------------------ */
.vide {
  display: grid; place-items: center; gap: var(--e-3);
  padding: var(--e-7) var(--e-4);
  text-align: center; color: var(--texte-faible);
  border: 1px dashed var(--ligne-forte);
  border-radius: var(--r-md);
}
.vide__titre { font-family: var(--f-titre); font-size: var(--t-lg); color: var(--texte-doux); }
.vide p { max-width: 42ch; font-size: var(--t-sm); margin: 0; }

/* --- Onglets -------------------------------------------------------------- */
.onglets {
  display: flex; gap: 0; border-bottom: 1px solid var(--ligne);
  margin-bottom: var(--e-5); overflow-x: auto;
}
.onglet {
  padding: var(--e-2) var(--e-4);
  background: none; border: 0; border-bottom: 2px solid transparent;
  color: var(--texte-doux); font-size: var(--t-sm); font-weight: 500;
  white-space: nowrap;
}
.onglet:hover { color: var(--texte); }
.onglet[aria-selected="true"] { color: var(--laiton-clair); border-bottom-color: var(--laiton); }

/* --- Modales -------------------------------------------------------------- */
.calque-modales { position: fixed; inset: 0; z-index: 200; pointer-events: none; }
.calque-modales:not(:empty) { pointer-events: auto; }

.voile {
  position: absolute; inset: 0;
  background: var(--voile);
  backdrop-filter: blur(2px);
  display: grid; place-items: center;
  padding: var(--e-4);
  animation: apparition 120ms ease-out;
}
@keyframes apparition { from { opacity: 0 } to { opacity: 1 } }

.modale {
  background: var(--encre-850);
  border: 1px solid var(--ligne-forte);
  border-radius: var(--r-md);
  box-shadow: var(--ombre-3);
  width: min(560px, 100%);
  max-height: min(86dvh, 860px);
  display: flex; flex-direction: column;
  animation: montee 140ms cubic-bezier(.2,.8,.3,1);
}
.modale--large { width: min(880px, 100%); }
@keyframes montee { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }

.modale__entete {
  display: flex; align-items: center; justify-content: space-between; gap: var(--e-3);
  padding: var(--e-4) var(--e-5);
  border-bottom: 1px solid var(--ligne);
}
.modale__titre { font-family: var(--f-titre); font-size: var(--t-xl); }
.modale__corps { padding: var(--e-5); overflow-y: auto; flex: 1; }
.modale__pied {
  display: flex; justify-content: flex-end; gap: var(--e-2);
  padding: var(--e-3) var(--e-5) var(--e-4);
  border-top: 1px solid var(--ligne);
}

/* --- Toasts --------------------------------------------------------------- */
.calque-toasts {
  position: fixed; right: var(--e-4); bottom: var(--e-4); z-index: 300;
  display: flex; flex-direction: column; gap: var(--e-2);
  pointer-events: none; max-width: min(380px, calc(100vw - 32px));
}
.toast {
  pointer-events: auto;
  display: flex; align-items: flex-start; gap: var(--e-3);
  background: var(--encre-800);
  border: 1px solid var(--ligne-forte);
  border-left: 3px solid var(--laiton);
  border-radius: var(--r-sm);
  padding: var(--e-3) var(--e-4);
  box-shadow: var(--ombre-2);
  font-size: var(--t-sm);
  animation: glisse 160ms cubic-bezier(.2,.8,.3,1);
}
.toast--ok     { border-left-color: var(--ok); }
.toast--alerte { border-left-color: var(--alerte); }
.toast--attn   { border-left-color: var(--attn); }
.toast__titre { font-weight: 600; display: block; }
.toast__corps { color: var(--texte-doux); font-size: var(--t-xs); }
.toast.part { animation: sortie 160ms ease-in forwards; }
@keyframes glisse { from { opacity: 0; transform: translateX(16px) } to { opacity: 1; transform: none } }
@keyframes sortie { to { opacity: 0; transform: translateX(16px) } }

/* --- Menu contextuel ------------------------------------------------------ */
.menu {
  position: fixed; z-index: 210;
  min-width: 190px;
  background: var(--encre-800);
  border: 1px solid var(--ligne-forte);
  border-radius: var(--r-sm);
  box-shadow: var(--ombre-2);
  padding: var(--e-1) 0;
  overflow: hidden;
}
.menu__sep { height: 1px; background: var(--ligne); margin: var(--e-1) 0; }
.menu__titre {
  padding: var(--e-2) var(--e-3) var(--e-1);
  font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--texte-faible);
}

/* --- Indicateur de connexion --------------------------------------------- */
.reseau {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--t-xs); color: var(--texte-faible);
  padding: 2px var(--e-2); border-radius: var(--r-xs);
}
.reseau[data-etat="rompu"]   { color: var(--alerte); background: rgba(180,85,78,.12); }
.reseau[data-etat="reprise"] { color: var(--attn);   background: rgba(201,150,63,.12); }
.reseau[data-etat="local"]   { color: var(--info);   background: rgba(91,130,156,.12); }

/* --- Statistiques --------------------------------------------------------- */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 1px;
  background: var(--ligne); border: 1px solid var(--ligne); border-radius: var(--r-md); overflow: hidden; }
.stat { background: var(--encre-850); padding: var(--e-3) var(--e-4); }
.stat__valeur { font-family: var(--f-titre); font-size: var(--t-2xl); font-weight: 600; line-height: 1.1; }
.stat__label { font-size: 9.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--texte-faible); }

/* --- Barre de progression ------------------------------------------------- */
.jauge { height: 4px; background: var(--encre-700); border-radius: 999px; overflow: hidden; }
.jauge__remplissage { height: 100%; background: var(--laiton); transition: width 240ms ease; }
.jauge__remplissage--ok { background: var(--ok); }

/* --- Divers --------------------------------------------------------------- */
.pile { display: flex; flex-direction: column; gap: var(--e-3); }
.pile--serre { gap: var(--e-2); }
.ligne-flex { display: flex; align-items: center; gap: var(--e-3); }
.ligne-flex--entre { justify-content: space-between; }
.ligne-flex--fin { justify-content: flex-end; }
.pousse { margin-left: auto; }
.doux { color: var(--texte-doux); }
.faible { color: var(--texte-faible); }
.petit { font-size: var(--t-xs); }
.centre { text-align: center; }
.tronque { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.enrouler { flex-wrap: wrap; }

/* --- Champ en erreur ------------------------------------------------------ */
.champ--erreur,
.saisie.champ--erreur,
.zone.champ--erreur { border-color: var(--alerte); background: rgba(180,85,78,.07); }

/* --- Dépôt de fichiers ----------------------------------------------------- */
.page.survol {
  outline: 2px dashed var(--laiton);
  outline-offset: -12px;
  background: rgba(201,162,39,.03);
}

/* --- Bouton-étiquette pour les champs fichier ------------------------------ */
label.btn { cursor: pointer; }
label.btn input[type="file"] { display: none; }

/* ===========================================================================
   Marquage roleplay

   Le hors-RP n'est pas interdit — l'interdire le pousse ailleurs, en vocal ou
   en privé, où il pollue quand même la scène. On lui donne une forme
   reconnaissable, en retrait, que l'œil saute naturellement en relisant.
   ========================================================================= */
.hrp {
  color: var(--texte-faible);
  font-style: italic;
  font-family: var(--f-ui);
  font-size: .92em;
  opacity: .85;
}
.hrp::before { content: "(( "; }
.hrp::after  { content: " ))"; }

.parchemin .hrp { color: #7c7263; }

.rp-action {
  font-style: italic;
  color: var(--texte-doux);
}
.parchemin .rp-action { color: #5c5344; }

.rp-pensee {
  font-style: italic;
  opacity: .9;
}
.rp-pensee::before { content: "« "; }
.rp-pensee::after  { content: " »"; }

/* Étiquette d'un message entièrement hors-RP */
.etiq--hrp {
  background: var(--encre-700);
  color: var(--texte-faible);
  border-color: var(--ligne-forte);
  font-style: italic;
}

/* --- Fiche de personnage --------------------------------------------------- */
.fiche {
  background: var(--encre-850);
  border: 1px solid var(--ligne-laiton);
  border-radius: var(--r-md);
  padding: var(--e-4) var(--e-5);
}
.fiche__entete {
  display: flex; align-items: baseline; gap: var(--e-2); flex-wrap: wrap;
  border-bottom: 1px solid var(--ligne); padding-bottom: var(--e-2); margin-bottom: var(--e-3);
}
.fiche__grade {
  font-size: var(--t-xs); letter-spacing: .16em; text-transform: uppercase;
  color: var(--laiton); font-weight: 600;
}
.fiche__nom { font-family: var(--f-titre); font-size: var(--t-xl); font-weight: 600; }
.fiche__ligne { display: flex; gap: var(--e-3); font-size: var(--t-sm); padding: 3px 0; }
.fiche__cle {
  flex: 0 0 8.5em; color: var(--texte-faible);
  font-size: var(--t-xs); letter-spacing: .08em; text-transform: uppercase;
}
.fiche__valeur { color: var(--texte); min-width: 0; }
.fiche__bio {
  margin-top: var(--e-3); padding-top: var(--e-3); border-top: 1px solid var(--ligne);
  font-family: var(--f-titre); color: var(--texte-doux); font-size: var(--t-md);
}

/* Date de l'univers : discrète, jamais en concurrence avec le contenu */
.date-rp {
  font-family: var(--f-titre); font-style: italic;
  color: var(--texte-faible); font-size: var(--t-sm);
}

/* --- Relevé de notes ------------------------------------------------------ */
/* Le chiffre d'abord, l'appréciation à côté : c'est dans cet ordre qu'on lit
   un bulletin, et c'est l'appréciation qu'on relit. */
.releve { display: flex; flex-direction: column; }
.releve__moyenne {
  display: flex; align-items: baseline; gap: var(--e-3);
  padding: var(--e-3) var(--e-4);
  border-bottom: 1px solid var(--ligne-laiton);
}
.releve__chiffre {
  font-family: var(--f-mono); font-size: var(--t-2xl); font-weight: 600;
  color: var(--laiton-clair); font-variant-numeric: tabular-nums;
}
.releve__ligne {
  display: flex; align-items: center; gap: var(--e-3);
  padding: var(--e-2) var(--e-4);
  border-bottom: 1px solid var(--ligne);
}
.releve__note {
  flex: 0 0 auto; min-width: 52px;
  font-family: var(--f-mono); font-size: var(--t-lg); font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.releve__note small { font-size: var(--t-xs); color: var(--texte-faible); font-weight: 400; }

/* ---- notebook.css ---- */
/* ===========================================================================
   Cahier — surface de parchemin, reliure, pages
   ========================================================================= */

.cahier {
  display: grid;
  grid-template-columns: 236px minmax(0, 1fr);
  height: 100%;
  min-height: 0;
  background: var(--encre-900);
}
.cahier--sans-tranche { grid-template-columns: minmax(0, 1fr); }

/* --- Tranche : liste des pages ------------------------------------------- */
.tranche {
  background: var(--encre-850);
  border-right: 1px solid var(--ligne);
  display: flex; flex-direction: column;
  min-height: 0;
}
.tranche__entete {
  padding: var(--e-3) var(--e-4);
  border-bottom: 1px solid var(--ligne);
  display: flex; align-items: center; gap: var(--e-2);
}
.tranche__titre {
  font-family: var(--f-titre); font-size: var(--t-md); font-weight: 600;
  flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tranche__pages { flex: 1; overflow-y: auto; padding: var(--e-2) 0; }
.tranche__pied { padding: var(--e-2); border-top: 1px solid var(--ligne); }

.onglet-page {
  display: flex; align-items: center; gap: var(--e-2);
  padding: 6px var(--e-3) 6px var(--e-2);
  margin: 1px var(--e-2);
  border-radius: var(--r-sm);
  font-size: var(--t-sm); color: var(--texte-doux);
  cursor: pointer; user-select: none;
  border: 1px solid transparent;
}
.onglet-page:hover { background: var(--encre-800); color: var(--texte); }
.onglet-page[aria-current="true"] {
  background: var(--encre-700); color: var(--texte); border-color: var(--ligne-forte);
}
.onglet-page__num {
  font-family: var(--f-mono); font-size: 10px; color: var(--texte-faible);
  width: 20px; text-align: right; flex: 0 0 auto;
}
.onglet-page__titre { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.onglet-page__marque { font-size: 10px; opacity: .7; }
.onglet-page.glisse { opacity: .4; }
.onglet-page.cible { border-top: 2px solid var(--laiton); }

/* --- Zone de la page ------------------------------------------------------ */
.feuillet {
  min-height: 0;
  display: flex; flex-direction: column;
  overflow: hidden;
  position: relative;
}
.feuillet__barre {
  display: flex; align-items: center; gap: var(--e-2);
  padding: var(--e-2) var(--e-3);
  background: var(--encre-850);
  border-bottom: 1px solid var(--ligne);
  flex-wrap: wrap;
}
.feuillet__zone {
  flex: 1; min-height: 0; overflow: auto;
  padding: var(--e-5);
  display: flex; justify-content: center;
  background:
    radial-gradient(circle at 50% 0%, rgba(201,162,39,.04), transparent 60%),
    var(--encre-900);
}

/* --- Parchemin ------------------------------------------------------------ */
.parchemin {
  width: min(820px, 100%);
  background: var(--parch-200);
  color: var(--parch-encre);
  border-radius: var(--r-sm);
  box-shadow: var(--ombre-2), inset 0 0 90px rgba(150,120,70,.09);
  border: 1px solid var(--parch-400);
  position: relative;
  padding: var(--e-6) var(--e-6) var(--e-7) calc(var(--e-6) + 34px);
  min-height: 560px;
  display: flex; flex-direction: column;
}
/* Marge rouge et reliure */
.parchemin::before {
  content: ""; position: absolute; left: 26px; top: 0; bottom: 0;
  width: 1px; background: rgba(160,70,60,.38);
}
.parchemin::after {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 8px;
  background: linear-gradient(90deg, rgba(120,95,55,.2), transparent);
  border-right: 1px solid var(--parch-400);
}
.parchemin--reglure .parchemin__corps {
  background-image: repeating-linear-gradient(
    transparent, transparent 27px, rgba(90,110,130,.22) 27px, rgba(90,110,130,.22) 28px);
  line-height: 28px;
}
.parchemin--quadrille .parchemin__corps {
  background-image:
    repeating-linear-gradient(transparent, transparent 27px, rgba(90,110,130,.16) 27px, rgba(90,110,130,.16) 28px),
    repeating-linear-gradient(90deg, transparent, transparent 27px, rgba(90,110,130,.16) 27px, rgba(90,110,130,.16) 28px);
  line-height: 28px;
}

.parchemin__entete {
  display: flex; align-items: baseline; gap: var(--e-3);
  border-bottom: 1px solid var(--parch-400);
  padding-bottom: var(--e-2); margin-bottom: var(--e-4);
}
.parchemin__titre {
  font-family: var(--f-titre); font-size: var(--t-xl); font-weight: 600;
  color: #1f1c16; background: none; border: 0; padding: 0; flex: 1; min-width: 0;
  width: 100%;
}
.parchemin__titre:focus { outline: none; border-bottom: 1px solid rgba(160,70,60,.5); }
.parchemin__date { font-size: var(--t-xs); color: #6d6455; font-family: var(--f-mono); }

.parchemin__corps {
  flex: 1;
  font-family: var(--f-titre);
  font-size: 1.0625rem;
  color: var(--parch-encre);
  background: transparent; border: 0; outline: none;
  width: 100%; resize: none;
  white-space: pre-wrap; word-break: break-word;
  min-height: 380px;
}
.parchemin__corps:empty::before {
  content: attr(data-vide);
  color: rgba(80,72,58,.45); font-style: italic;
}
.parchemin__corps b, .parchemin__corps strong { font-weight: 700; }
.parchemin__corps mark { background: rgba(201,162,39,.4); color: inherit; padding: 0 2px; }
.parchemin__corps h2 { font-size: 1.25rem; margin: 1.2em 0 .3em; color: #241f17; }
.parchemin__corps h3 { font-size: 1.1rem; margin: 1em 0 .25em; }
.parchemin__corps ul, .parchemin__corps ol { padding-left: 1.4em; margin: .4em 0; }
.parchemin__corps blockquote {
  border-left: 3px solid rgba(160,70,60,.4); margin: .6em 0; padding-left: .8em;
  font-style: italic; color: #4b4438;
}
.parchemin__corps img { max-width: 100%; border-radius: var(--r-xs); border: 1px solid var(--parch-400); }
.parchemin__corps a { color: #6b4f12; text-decoration: underline; }

.parchemin__pied {
  margin-top: var(--e-4); padding-top: var(--e-2);
  border-top: 1px solid var(--parch-400);
  display: flex; align-items: center; justify-content: space-between;
  font-size: var(--t-xs); color: #736a58; font-family: var(--f-mono);
}

/* Pièce jointe capturée depuis le tableau */
.parchemin__capture {
  margin: var(--e-3) 0;
  border: 1px solid var(--parch-400);
  border-radius: var(--r-sm);
  background: #eee4d0;
  padding: var(--e-2);
}
.parchemin__capture img { display: block; width: 100%; border-radius: var(--r-xs); }
.parchemin__capture figcaption { font-size: var(--t-xs); color: #6d6455; margin-top: 4px; }

/* --- Barre d'outils de texte --------------------------------------------- */
.outils-texte { display: flex; align-items: center; gap: 1px; flex-wrap: wrap; }
.outils-texte .btn--icone { width: 28px; min-height: 28px; }

/* --- Sélecteur de couverture ---------------------------------------------- */
.couvertures { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: var(--e-2); }
.couverture {
  aspect-ratio: 3/4; border-radius: var(--r-sm); border: 2px solid var(--ligne);
  cursor: pointer; position: relative; overflow: hidden;
  display: grid; place-content: end center; padding-bottom: 6px;
  font-size: 9px; letter-spacing: .1em; text-transform: uppercase;
}
.couverture[aria-pressed="true"] { border-color: var(--laiton); }
.couverture--parchment { background: linear-gradient(160deg, #e8dcc4, #cbb994); color: #4a3f28; }
.couverture--cuir      { background: linear-gradient(160deg, #4a3527, #2c1f16); color: #c0a482; }
.couverture--ardoise   { background: linear-gradient(160deg, #3d525c, #22303a); color: #b8cdd8; }
.couverture--olive     { background: linear-gradient(160deg, #6f7d4d, #3f4a2b); color: #d8e0c2; }
.couverture--oxblood   { background: linear-gradient(160deg, #7c3a3a, #4a2020); color: #e5bfbb; }
.couverture--encre     { background: linear-gradient(160deg, #2a323a, #14181d); color: #9aa6b2; }

/* --- Vignette de cahier --------------------------------------------------- */
.dos-cahier {
  display: flex; gap: var(--e-3);
  padding: var(--e-3);
  background: var(--encre-850);
  border: 1px solid var(--ligne); border-radius: var(--r-md);
  transition: border-color var(--transition), transform var(--transition);
  color: inherit;
}
.dos-cahier:hover { border-color: var(--ligne-forte); text-decoration: none; transform: translateY(-1px); }
.dos-cahier__vignette {
  width: 46px; height: 62px; flex: 0 0 auto; border-radius: 2px 4px 4px 2px;
  box-shadow: inset -6px 0 8px -6px rgba(0,0,0,.5), var(--ombre-1);
  position: relative;
}
.dos-cahier__vignette::after {
  content: ""; position: absolute; left: 4px; top: 0; bottom: 0; width: 1px;
  background: rgba(0,0,0,.25);
}
.dos-cahier__infos { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: 2px; }
.dos-cahier__titre { font-family: var(--f-titre); font-size: var(--t-md); font-weight: 600; }

/* --- Notes personnelles pendant le cours --------------------------------- */
.note-perso {
  background: #f7f0c9;
  color: #3a3420;
  border: 1px solid #ddd09a;
  border-radius: var(--r-sm);
  padding: var(--e-3);
  font-family: var(--f-titre);
  box-shadow: var(--ombre-1);
}
.note-perso textarea {
  width: 100%; border: 0; background: transparent; resize: vertical;
  min-height: 130px; font: inherit; color: inherit; outline: none;
  line-height: 1.6;
}

/* ===========================================================================
   Le cahier comme objet

   Un cahier qu'on feuillette n'est pas une liste de pages : il s'ouvre, les
   feuilles tournent, et les repères dépassent de la tranche. C'est ce qui
   fait la différence entre prendre des notes et jouer une scène.
   ========================================================================= */

/* --- Reliure et épaisseur -------------------------------------------------- */
.feuillet__zone { perspective: 2400px; }

.relieur {
  position: relative;
  width: min(820px, 100%);
  transform-style: preserve-3d;
}

/* L'épaisseur du bloc de pages, sous la feuille courante. */
.relieur::before,
.relieur::after {
  content: "";
  position: absolute;
  left: 6px; right: 6px; bottom: -3px;
  height: 10px;
  background: var(--parch-300);
  border: 1px solid var(--parch-400);
  border-radius: 0 0 var(--r-sm) var(--r-sm);
  z-index: -1;
}
.relieur::after {
  left: 12px; right: 12px; bottom: -6px;
  background: var(--parch-400);
}

/* --- Page qui tourne ------------------------------------------------------- */
.parchemin {
  transform-origin: left center;
  backface-visibility: hidden;
  will-change: transform, opacity;
}

@keyframes tourne-avant {
  0%   { transform: rotateY(0deg);   opacity: 1; }
  45%  { transform: rotateY(-58deg); opacity: .82; box-shadow: -18px 0 40px rgba(0,0,0,.35); }
  55%  { transform: rotateY(58deg);  opacity: .82; box-shadow: 18px 0 40px rgba(0,0,0,.35); }
  100% { transform: rotateY(0deg);   opacity: 1; }
}
@keyframes tourne-arriere {
  0%   { transform: rotateY(0deg);   opacity: 1; }
  45%  { transform: rotateY(58deg);  opacity: .82; box-shadow: 18px 0 40px rgba(0,0,0,.35); }
  55%  { transform: rotateY(-58deg); opacity: .82; box-shadow: -18px 0 40px rgba(0,0,0,.35); }
  100% { transform: rotateY(0deg);   opacity: 1; }
}
.parchemin.tourne-avant   { animation: tourne-avant 420ms cubic-bezier(.4,.05,.3,1); }
.parchemin.tourne-arriere { animation: tourne-arriere 420ms cubic-bezier(.4,.05,.3,1); }

/* Une feuille volante ne se feuillette pas : elle se pose. */
.parchemin--feuille {
  min-height: 420px;
  box-shadow: var(--ombre-2);
  transform: rotate(-.25deg);
}
.parchemin--feuille::after { display: none; }
.relieur--feuille::before,
.relieur--feuille::after { display: none; }

/* --- Repères de tranche ----------------------------------------------------- */
.reperes {
  position: absolute;
  right: -13px; top: 42px;
  display: flex; flex-direction: column; gap: 6px;
  z-index: 3;
}
.repere {
  width: 26px; height: 22px;
  border-radius: 0 3px 3px 0;
  border: 1px solid rgba(0,0,0,.22);
  border-left: 0;
  box-shadow: 1px 1px 3px rgba(0,0,0,.28);
  cursor: pointer;
  display: grid; place-content: center;
  font-size: 9px; font-weight: 700; color: rgba(0,0,0,.55);
  transition: width var(--transition), transform var(--transition);
  padding: 0;
}
.repere:hover, .repere:focus-visible { width: 34px; }
.repere[aria-current="true"] { width: 34px; transform: translateX(2px); }

.repere--rouge  { background: #c05a52; }
.repere--bleu   { background: #5b829c; }
.repere--vert   { background: #7d9c6a; }
.repere--jaune  { background: #d8bd63; }
.repere--violet { background: #8d7bb0; }

/* --- Pense-bêtes ------------------------------------------------------------ */
.pense-bete {
  position: absolute;
  width: 132px; min-height: 108px;
  padding: 14px 10px 8px;
  font-family: var(--f-ui);
  font-size: 12px; line-height: 1.4;
  color: #3a3420;
  box-shadow: 1px 2px 6px rgba(0,0,0,.25);
  z-index: 4;
  cursor: grab;
  border: 0;
  text-align: left;
  /* Le coin corné : un rectangle parfait ne ressemble à rien de collé. */
  clip-path: polygon(0 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%);
}
.pense-bete:active { cursor: grabbing; }

/* La bande de colle, en haut : c'est par là qu'on attrape le papier. */
.pense-bete__prise {
  position: absolute; inset: 0 0 auto 0; height: 12px;
  background: linear-gradient(180deg, rgba(255,255,255,.45), rgba(255,255,255,0));
}

.pense-bete__texte {
  min-height: 74px;
  white-space: pre-wrap;
  word-break: break-word;
  cursor: text;
  outline: 0;
}
.pense-bete__texte:empty::before {
  content: attr(data-invite);
  color: rgba(0,0,0,.32);
}
.pense-bete__texte:focus {
  outline: 2px solid rgba(0,0,0,.28); outline-offset: 2px;
}
.pense-bete--jaune  { background: #f7e9a0; }
.pense-bete--rose   { background: #f4c4c4; }
.pense-bete--vert   { background: #c8e0b4; }
.pense-bete--bleu   { background: #bcd6ea; }
.pense-bete--orange { background: #f5d2a4; }

.pense-bete__retirer {
  position: absolute; top: 2px; right: 16px;
  background: none; border: 0; padding: 2px;
  color: rgba(0,0,0,.35); cursor: pointer; line-height: 1;
  opacity: 0; transition: opacity var(--transition);
}
.pense-bete:hover .pense-bete__retirer,
.pense-bete:focus-within .pense-bete__retirer { opacity: 1; }



/* --- Couvertures et couleurs de support ------------------------------------- */
.dos-cahier__vignette[data-support="feuille"] {
  border-radius: 1px;
  box-shadow: var(--ombre-1);
  background-image: linear-gradient(160deg, #f6f1e3, #e6dcc6) !important;
}
.dos-cahier__vignette[data-support="dossier"] {
  border-radius: 2px 6px 6px 2px;
}
.dos-cahier__vignette[data-support="dossier"]::before {
  content: ""; position: absolute; top: -3px; left: 8px; right: 14px; height: 6px;
  background: inherit; border-radius: 3px 3px 0 0;
}

.etiq-support {
  font-size: 9px; letter-spacing: .12em; text-transform: uppercase;
  color: var(--texte-faible);
}

/* --- Choix d'un objet : on montre la chose, on ne la nomme pas seulement --- */
.choix-objets {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
  gap: var(--e-2);
}
.choix-objet {
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  padding: var(--e-3) var(--e-2);
  background: var(--surface-1);
  border: 1px solid var(--bord);
  border-radius: var(--r-2);
  cursor: pointer;
  text-align: center;
  transition: border-color var(--transition), background var(--transition), transform var(--transition);
}
.choix-objet:hover { border-color: var(--bord-fort); transform: translateY(-1px); }
.choix-objet[aria-checked="true"] {
  border-color: var(--laiton);
  background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--laiton);
}
.choix-objet__nom { font-size: 12px; font-weight: 600; color: var(--texte); }
.choix-objet__aide { font-size: 10px; color: var(--texte-faible); line-height: 1.3; }

/* Chaque objet est dessiné en CSS : pas d'icône générique. */
.choix-objet__figure {
  position: relative;
  width: 46px; height: 56px;
  border-radius: 2px;
  background: linear-gradient(160deg, #f6f1e3, #e4d9c1);
  box-shadow: 1px 2px 4px rgba(0,0,0,.22);
}
.choix-objet__figure[data-objet="feuille"] {
  background: linear-gradient(160deg, #fbf8f0, #ece5d4);
}
.choix-objet__figure[data-objet="feuille"]::after {
  content: ""; position: absolute; inset: 10px 8px auto 8px; height: 1px;
  background: rgba(0,0,0,.14);
  box-shadow: 0 6px 0 rgba(0,0,0,.12), 0 12px 0 rgba(0,0,0,.12), 0 18px 0 rgba(0,0,0,.1);
}
.choix-objet__figure[data-objet="cahier"] {
  background: linear-gradient(160deg, #6f5a3c, #4c3d28);
  border-radius: 2px 4px 4px 2px;
}
.choix-objet__figure[data-objet="cahier"]::before {
  content: ""; position: absolute; left: 5px; top: 4px; bottom: 4px; width: 3px;
  background: rgba(0,0,0,.3); border-radius: 2px;
}
.choix-objet__figure[data-objet="cahier"]::after {
  content: ""; position: absolute; right: -3px; top: 5px; bottom: 5px; width: 4px;
  background: repeating-linear-gradient(180deg, #efe7d5 0 2px, #cfc4ab 2px 3px);
  border-radius: 0 2px 2px 0;
}
.choix-objet__figure[data-objet="carnet"] {
  width: 38px;
  background: linear-gradient(160deg, #4a4f45, #2f332c);
  border-radius: 3px;
}
.choix-objet__figure[data-objet="carnet"]::before {
  content: ""; position: absolute; left: 50%; top: -3px; width: 60%; height: 6px;
  transform: translateX(-50%);
  background: repeating-linear-gradient(90deg, transparent 0 3px, #b8a87e 3px 5px);
}
.choix-objet__figure[data-objet="carnet"]::after {
  content: ""; position: absolute; right: 6px; bottom: 6px; width: 10px; height: 14px;
  background: var(--oxblood, #7d2b2b); border-radius: 1px;
}
.choix-objet__figure[data-objet="dossier"] {
  background: linear-gradient(160deg, #a8946a, #7e6c47);
  border-radius: 2px 6px 6px 2px;
}
.choix-objet__figure[data-objet="dossier"]::before {
  content: ""; position: absolute; top: -4px; left: 6px; right: 16px; height: 7px;
  background: inherit; border-radius: 3px 3px 0 0;
}
.choix-objet__figure[data-objet="dossier"]::after {
  content: ""; position: absolute; inset: 8px 6px 6px 6px;
  background: rgba(255,255,255,.55);
  box-shadow: 2px -2px 0 rgba(255,255,255,.3);
  border-radius: 1px;
}

@media (prefers-reduced-motion: reduce) {
  .choix-objet { transition: none; }
  .choix-objet:hover { transform: none; }
}

/* --- La règle de proximité ------------------------------------------------- */
.proximite__scene {
  position: relative;
  height: 74px;
  margin: 0 auto var(--e-4);
  display: flex; align-items: center; justify-content: center; gap: 56px;
  border-bottom: 1px solid var(--bord);
}
.proximite__silhouette {
  position: relative;
  width: 18px; height: 42px;
  background: var(--encre-400, #2a323a);
  border-radius: 9px 9px 3px 3px;
  opacity: .8;
}
.proximite__silhouette::before {
  content: ""; position: absolute; top: -12px; left: 50%; transform: translateX(-50%);
  width: 14px; height: 14px; border-radius: 50%; background: inherit;
}
.proximite__silhouette--autre { background: var(--laiton, #9a7b3f); }
.proximite__onde {
  position: absolute; left: 50%; top: 50%;
  width: 22px; height: 22px; margin: -11px 0 0 -11px;
  border: 1px solid var(--laiton, #9a7b3f); border-radius: 50%;
  animation: proximite-onde 2.2s ease-out infinite;
}
@keyframes proximite-onde {
  0%   { transform: scale(.4); opacity: .9; }
  100% { transform: scale(3.4); opacity: 0; }
}
/* Les deux silhouettes se rapprochent : le geste est montré, pas décrit. */
.proximite__silhouette--soi   { animation: proximite-vers-droite 2.2s ease-in-out infinite alternate; }
.proximite__silhouette--autre { animation: proximite-vers-gauche 2.2s ease-in-out infinite alternate; }
@keyframes proximite-vers-droite { from { transform: translateX(-10px); } to { transform: translateX(6px); } }
@keyframes proximite-vers-gauche { from { transform: translateX(10px); } to { transform: translateX(-6px); } }

.proximite__phrase { margin-bottom: var(--e-3); }
.proximite__case { margin-top: var(--e-3); }
.proximite__note { margin-top: var(--e-3); display: flex; align-items: center; gap: 4px; }
.case--exigee {
  outline: 1px solid var(--oxblood, #7d2b2b);
  outline-offset: 4px;
  border-radius: var(--r-1);
}

@media (prefers-reduced-motion: reduce) {
  .proximite__onde,
  .proximite__silhouette--soi,
  .proximite__silhouette--autre { animation: none; }
  .proximite__onde { opacity: .35; transform: scale(2); }
}

/* ---- objets.css ---- */
/* ---------------------------------------------------------------------------
 * Les objets de la scène : cartable, trousse, papiers.
 *
 * Tout ce qui se tient dans la main a ici une forme propre. On reconnaît un
 * dossier d'un carnet sans lire l'étiquette, et un ordre de mission ne
 * ressemble pas à un mot griffonné.
 * ------------------------------------------------------------------------- */

/* --- Cartable --------------------------------------------------------------- */
.cartable__consigne {
  margin: var(--e-3) 0;
  padding: var(--e-3);
  border-left: 2px solid var(--attn);
  background: rgba(201,150,63,.07);
  border-radius: 0 var(--r-1) var(--r-1) 0;
}
.cartable__consigne p { margin: 4px 0 0; }

.cartable__sac {
  position: relative;
  margin-top: var(--e-4);
  padding: var(--e-5) var(--e-4) var(--e-4);
  background: linear-gradient(170deg, #55432c, #3a2d1d);
  border: 1px solid #2a2015;
  border-radius: var(--r-2) var(--r-2) 12px 12px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.08), var(--ombre-2, 0 6px 18px rgba(0,0,0,.35));
}
/* La poignée dépasse du sac : c'est ce qui le fait lire comme un sac. */
.cartable__poignee {
  position: absolute; top: -13px; left: 50%; transform: translateX(-50%);
  width: 92px; height: 26px;
  border: 5px solid #4a3a26;
  border-bottom: 0;
  border-radius: 46px 46px 0 0;
}
.cartable__rabat {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--e-3);
  margin-bottom: var(--e-4);
  padding-bottom: var(--e-3);
  border-bottom: 1px dashed rgba(255,255,255,.16);
  font-size: 12px;
}
.cartable__compte { color: rgba(255,255,255,.72); letter-spacing: .04em; }
.cartable__manque  { color: #e8b970; display: inline-flex; align-items: center; gap: 4px; }
.cartable__complet { color: #9ecf8f; display: inline-flex; align-items: center; gap: 4px; }

.cartable__poche { margin-bottom: var(--e-4); }
.cartable__poche:last-child { margin-bottom: 0; }
.cartable__titre {
  display: flex; align-items: center; gap: 6px;
  margin: 0 0 var(--e-3);
  font-size: 11px; letter-spacing: .14em; text-transform: uppercase;
  color: rgba(255,255,255,.55);
  font-weight: 600;
}

.cartable__objets {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(112px, 1fr));
  gap: var(--e-2);
}

/* Un objet qu'on prend dans le sac : il se soulève, puis il s'assoit dedans. */
.objet {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  padding: var(--e-3) var(--e-2);
  background: rgba(255,255,255,.05);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: var(--r-2);
  color: rgba(255,255,255,.85);
  cursor: pointer;
  text-align: center;
  transition: transform .18s ease, background .18s ease, border-color .18s ease;
}
.objet:hover { transform: translateY(-2px); background: rgba(255,255,255,.09); }
.objet--pris {
  background: rgba(201,162,39,.16);
  border-color: var(--laiton);
  transform: translateY(2px);
  box-shadow: inset 0 2px 5px rgba(0,0,0,.3);
}
.objet--demande { border-color: rgba(201,150,63,.55); }
.objet__nom  { font-size: 11px; font-weight: 600; line-height: 1.25; word-break: break-word; }
.objet__type { font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255,255,255,.45); }
.objet__demande {
  font-size: 9px; letter-spacing: .08em; text-transform: uppercase;
  color: var(--attn);
}
.objet__figure {
  position: relative; width: 34px; height: 42px; border-radius: 2px;
  background: linear-gradient(160deg, #f2ead8, #d8cbaf);
  box-shadow: 1px 2px 4px rgba(0,0,0,.35);
}
.objet__figure[data-objet="cahier"] { background: linear-gradient(160deg, #6f5a3c, #48391f); }
.objet__figure[data-objet="cahier"]::after {
  content: ""; position: absolute; right: -2px; top: 4px; bottom: 4px; width: 3px;
  background: repeating-linear-gradient(180deg, #efe7d5 0 2px, #cfc4ab 2px 3px);
}
.objet__figure[data-objet="carnet"] { width: 28px; background: linear-gradient(160deg, #4a4f45, #2c302a); }
.objet__figure[data-objet="dossier"] { background: linear-gradient(160deg, #a8946a, #7b6942); }
.objet__figure[data-objet="dossier"]::before {
  content: ""; position: absolute; top: -3px; left: 4px; right: 12px; height: 6px;
  background: inherit; border-radius: 3px 3px 0 0;
}
.objet__figure[data-objet="feuille"]::after {
  content: ""; position: absolute; inset: 8px 6px auto 6px; height: 1px;
  background: rgba(0,0,0,.16);
  box-shadow: 0 5px 0 rgba(0,0,0,.13), 0 10px 0 rgba(0,0,0,.11), 0 15px 0 rgba(0,0,0,.09);
}

/* --- Trousse ---------------------------------------------------------------- */
.trousse {
  position: relative;
  padding: var(--e-4) var(--e-3) var(--e-3);
  background: linear-gradient(170deg, #3f4a3a, #2b3328);
  border: 1px solid #222a20;
  border-radius: 14px;
  box-shadow: inset 0 1px 0 rgba(255,255,255,.07);
}
/* La fermeture éclair, en pointillé : la trousse se reconnaît à ça. */
.trousse__rabat {
  position: absolute; top: 9px; left: 12px; right: 12px; height: 4px;
  background: repeating-linear-gradient(90deg, #b8a87e 0 3px, transparent 3px 6px);
  border-radius: 2px;
}
.trousse__contenu { display: flex; flex-wrap: wrap; gap: 6px; }

.fourniture {
  padding: 5px 11px;
  font-size: 11px;
  background: rgba(255,255,255,.06);
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 999px;
  color: rgba(255,255,255,.8);
  cursor: pointer;
  transition: background .16s ease, border-color .16s ease, transform .16s ease;
}
.fourniture:hover { background: rgba(255,255,255,.12); }
.fourniture--prise {
  background: rgba(201,162,39,.2);
  border-color: var(--laiton);
  color: #f0e2bd;
  transform: translateY(1px);
}
.fourniture--demande { border-color: rgba(201,150,63,.5); }

@media (prefers-reduced-motion: reduce) {
  .objet, .fourniture { transition: none; }
  .objet:hover { transform: none; }
}

/* ===========================================================================
   Papiers
   Cinq modèles, cinq objets distincts. Le papier est toujours clair, même en
   thème sombre : une feuille n'est pas une interface.
   ========================================================================= */
.papier {
  position: relative;
  max-width: 560px;
  margin: 0 auto;
  padding: 30px 32px 26px;
  background: #f4efe2;
  color: #2b2418;
  font-family: var(--f-texte, Spectral), Georgia, serif;
  font-size: 14px;
  line-height: 1.62;
  box-shadow: 0 8px 22px rgba(0,0,0,.34), inset 0 0 44px rgba(120,96,56,.09);
  /* Le grain : sans lui, c'est un rectangle blanc, pas du papier. */
  background-image:
    radial-gradient(circle at 18% 22%, rgba(140,112,64,.07) 0 3px, transparent 3px),
    radial-gradient(circle at 72% 64%, rgba(140,112,64,.06) 0 4px, transparent 4px),
    radial-gradient(circle at 44% 88%, rgba(140,112,64,.05) 0 3px, transparent 3px);
}
.papier__corps { margin: 0; }
.papier__corps p { margin: 0 0 .55em; }
.papier__blanc { min-height: .6em; }

.papier__entete { margin-bottom: 20px; }
.papier__surtitre {
  display: block;
  font-family: var(--f-ui, Inter), sans-serif;
  font-size: 10px; letter-spacing: .3em; text-transform: uppercase;
  color: #8a6f3e;
}
.papier__titre {
  margin: 4px 0 0;
  font-size: 20px; font-weight: 600; letter-spacing: .01em;
}
.papier__date {
  display: block; margin-top: 6px;
  font-family: var(--f-ui, Inter), sans-serif;
  font-size: 11px; color: #6d5f48; font-style: italic;
}
.papier__pied {
  display: flex; align-items: flex-end; justify-content: space-between; gap: var(--e-4);
  margin-top: 26px; padding-top: 14px;
  border-top: 1px solid rgba(90,72,42,.22);
  font-family: var(--f-ui, Inter), sans-serif;
  font-size: 11px;
}
.papier__mention { display: flex; flex-direction: column; gap: 2px; }
.papier__cle {
  font-size: 9px; letter-spacing: .16em; text-transform: uppercase; color: #8a7a5c;
}
.papier__signature { display: flex; flex-direction: column; gap: 3px; }
.papier__paraphe {
  font-family: var(--f-texte, Spectral), Georgia, serif;
  font-style: italic; font-size: 14px; color: #3a2f1e;
}
.papier__trait {
  display: block; width: 168px; height: 1px;
  background: rgba(90,72,42,.45);
}

/* --- Le cachet -------------------------------------------------------------- */
.papier__cachet {
  position: relative;
  width: 92px; height: 92px;
  display: grid; place-items: center;
  transform: rotate(-11deg);
  color: #8e3a34;
  flex: 0 0 auto;
}
.papier__cachet-anneau {
  position: absolute; inset: 0;
  border: 2px solid currentColor;
  border-radius: 50%;
  opacity: .58;
  box-shadow: inset 0 0 0 4px rgba(142,58,52,.14);
}
.papier__cachet-texte {
  max-width: 68px; padding: 0 4px;
  font-family: var(--f-ui, Inter), sans-serif;
  font-size: 8.5px; font-weight: 700; letter-spacing: .1em;
  text-transform: uppercase; text-align: center; line-height: 1.25;
  opacity: .78;
}

/* --- Le mot ----------------------------------------------------------------- */
.papier[data-modele="note"] {
  max-width: 400px;
  padding: 26px 26px 22px;
  background: #f7f2e4;
  font-family: var(--f-texte, Spectral), Georgia, serif;
  /* Le bord inférieur déchiré : ce mot a été arraché d'une page. */
  clip-path: polygon(
    0 0, 100% 0, 100% 96%, 92% 99%, 84% 96%, 76% 99.5%, 68% 96.5%, 60% 99%,
    52% 96%, 44% 99%, 36% 96%, 28% 99.5%, 20% 96.5%, 12% 99%, 4% 96%, 0 99%);
  box-shadow: 0 6px 16px rgba(0,0,0,.3);
}
/* Le pli central, marqué au dos puis rouvert. */
.papier[data-modele="note"] .papier__pliure {
  position: absolute; left: 0; right: 0; top: 48%;
  height: 2px;
  background: linear-gradient(90deg,
    transparent, rgba(120,98,58,.22) 12%, rgba(255,255,255,.65) 50%, rgba(120,98,58,.22) 88%, transparent);
}
.papier[data-modele="note"] .papier__titre { font-size: 16px; }
.papier[data-modele="note"] .papier__pied { border-top: 0; justify-content: flex-end; }

/* --- Ordre de mission et convocation ---------------------------------------- */
.papier[data-modele="ordre"] .papier__bande,
.papier[data-modele="convocation"] .papier__bande {
  position: absolute; left: 0; right: 0; top: 0; height: 7px;
}
.papier[data-modele="ordre"] .papier__bande {
  background: repeating-linear-gradient(90deg, #7a5a24 0 22px, #a8843a 22px 44px);
}
.papier[data-modele="convocation"] .papier__bande {
  background: linear-gradient(90deg, #4a5a64, #7b8f99, #4a5a64);
}
.papier[data-modele="ordre"] .papier__entete,
.papier[data-modele="convocation"] .papier__entete {
  padding-bottom: 14px;
  border-bottom: 2px solid rgba(90,72,42,.3);
}
.papier[data-modele="convocation"] { text-align: center; }
.papier[data-modele="convocation"] .papier__corps { text-align: left; }
.papier[data-modele="convocation"] .papier__pied { text-align: left; }

/* --- Laissez-passer --------------------------------------------------------- */
.papier[data-modele="laissezpasser"] {
  max-width: 520px;
  padding: 24px 30px 20px 44px;
  background: linear-gradient(100deg, #eee6d2, #f6f1e4);
  border-radius: 3px;
  box-shadow: 0 6px 18px rgba(0,0,0,.3);
}
/* Le bord perforé, à gauche : la carte a été détachée d'un carnet à souche. */
.papier[data-modele="laissezpasser"] .papier__perforation {
  position: absolute; left: 20px; top: 12px; bottom: 12px; width: 2px;
  background: repeating-linear-gradient(180deg,
    rgba(90,72,42,.42) 0 4px, transparent 4px 10px);
}
.papier[data-modele="laissezpasser"] .papier__titre { font-size: 17px; }
.papier[data-modele="laissezpasser"] .papier__pied { align-items: center; }
.papier[data-modele="laissezpasser"] .papier__cachet {
  width: 76px; height: 76px; transform: rotate(7deg);
}

/* --- Rapport ---------------------------------------------------------------- */
.papier[data-modele="rapport"] {
  padding-top: 24px;
  background: #f6f3e9;
}
.papier__entete--formulaire {
  padding-bottom: 12px;
  border-bottom: 2px solid rgba(60,72,84,.32);
}
.papier__champs {
  display: flex; flex-wrap: wrap; gap: var(--e-4);
  margin-top: 10px;
  font-family: var(--f-ui, Inter), sans-serif; font-size: 11px;
}
/* La réglure : on écrit sur des lignes, dans un formulaire de service. */
.papier__reglure {
  padding: 4px 0;
  background-image: repeating-linear-gradient(180deg,
    transparent 0 25px, rgba(60,72,84,.16) 25px 26px);
  background-position: 0 2px;
}
.papier__reglure .papier__corps p { margin: 0; line-height: 26px; }

/* --- Miniature (étagère, boîte de réception) -------------------------------- */
.papier--miniature {
  max-width: 100%;
  padding: 16px 18px 14px;
  font-size: 12px;
  box-shadow: 0 3px 10px rgba(0,0,0,.26);
}
.papier--miniature .papier__titre { font-size: 14px; }
.papier--miniature .papier__corps {
  max-height: 68px; overflow: hidden;
  /* Le texte s'efface plutôt que de se couper net. */
  mask-image: linear-gradient(180deg, #000 60%, transparent);
}
.papier--miniature .papier__cachet { width: 54px; height: 54px; }
.papier--miniature .papier__cachet-texte { font-size: 6.5px; max-width: 42px; }
.papier--miniature .papier__pied { margin-top: 12px; padding-top: 8px; }

/* --- Composition ------------------------------------------------------------ */
.composeur {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
  gap: var(--e-5);
  align-items: start;
}
.composeur__apercu {
  position: sticky; top: 0;
  padding: var(--e-4);
  background: var(--surface-0, #14181d);
  border: 1px solid var(--bord);
  border-radius: var(--r-2);
}
.composeur__legende {
  display: block; margin-bottom: var(--e-3);
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--texte-faible);
}
.papier-apercu { transform-origin: top center; }

.modeles { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: var(--e-2); }
.modele {
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: var(--e-2);
  background: var(--surface-1); border: 1px solid var(--bord);
  border-radius: var(--r-2); cursor: pointer; text-align: center;
  transition: border-color var(--transition), background var(--transition);
}
.modele:hover { border-color: var(--bord-fort); }
.modele[aria-pressed="true"] {
  border-color: var(--laiton); background: var(--surface-2);
  box-shadow: inset 0 0 0 1px var(--laiton);
}
.modele__nom { font-size: 11px; font-weight: 600; color: var(--texte); }
.modele__resume { font-size: 9px; line-height: 1.3; color: var(--texte-faible); }

/* Chaque modèle se reconnaît à sa vignette avant même d'être lu. */
.modele__figure {
  position: relative; width: 30px; height: 38px;
  background: #efe8d6; border-radius: 1px;
  box-shadow: 1px 1px 3px rgba(0,0,0,.3);
}
.modele__figure[data-modele="note"] {
  height: 26px; width: 34px;
  clip-path: polygon(0 0, 100% 0, 100% 86%, 88% 100%, 72% 88%, 56% 100%, 40% 88%, 24% 100%, 8% 88%, 0 100%);
}
.modele__figure[data-modele="ordre"]::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 5px;
  background: repeating-linear-gradient(90deg, #7a5a24 0 5px, #a8843a 5px 10px);
}
.modele__figure[data-modele="convocation"]::before {
  content: ""; position: absolute; inset: 0 0 auto 0; height: 5px;
  background: linear-gradient(90deg, #4a5a64, #8397a1, #4a5a64);
}
.modele__figure[data-modele="laissezpasser"] {
  width: 38px; height: 26px;
}
.modele__figure[data-modele="laissezpasser"]::before {
  content: ""; position: absolute; left: 5px; top: 3px; bottom: 3px; width: 1px;
  background: repeating-linear-gradient(180deg, rgba(90,72,42,.5) 0 2px, transparent 2px 5px);
}
.modele__figure[data-modele="rapport"]::after {
  content: ""; position: absolute; inset: 10px 5px 5px 5px;
  background: repeating-linear-gradient(180deg, transparent 0 4px, rgba(60,72,84,.28) 4px 5px);
}

/* --- Remise et réception ---------------------------------------------------- */
.remise__liste {
  max-height: 220px; overflow: auto;
  margin: var(--e-3) 0;
  border: 1px solid var(--bord); border-radius: var(--r-2);
}
.remise__ligne {
  padding: var(--e-2) var(--e-3);
  border-bottom: 1px solid var(--bord);
}
.remise__ligne:last-child { border-bottom: 0; }

.reception__main {
  margin: var(--e-4) 0;
  /* Le papier arrive dans la main : il se pose, légèrement de travers. */
  animation: papier-tendu .42s cubic-bezier(.2,.9,.3,1.1) both;
}
@keyframes papier-tendu {
  from { opacity: 0; transform: translateY(26px) rotate(-3deg) scale(.94); }
  to   { opacity: 1; transform: none; }
}
.reception__note { display: flex; align-items: center; gap: 4px; }

@media (max-width: 860px) {
  .composeur { grid-template-columns: minmax(0, 1fr); }
  .composeur__apercu { position: static; }
  .papier { padding: 22px 20px 18px; }
}
@media (prefers-reduced-motion: reduce) {
  .reception__main { animation: none; }
}

/* --- Cartes de la sacoche --------------------------------------------------- */
.papier-carte {
  display: flex; flex-direction: column; gap: var(--e-3);
  padding: var(--e-3);
  background: var(--surface-1);
  border: 1px solid var(--bord);
  border-radius: var(--r-2);
}
.papier-carte__entete {
  display: flex; align-items: center; gap: var(--e-2);
  font-size: 11px;
}
.papier-carte__objet {
  display: block; width: 100%; padding: 0;
  background: none; border: 0; cursor: pointer;
  text-align: left;
  transition: transform .2s ease;
}
button.papier-carte__objet:hover { transform: translateY(-3px) rotate(-.4deg); }
.papier-carte__pied { display: flex; justify-content: flex-end; }

@media (prefers-reduced-motion: reduce) {
  .papier-carte__objet { transition: none; }
  button.papier-carte__objet:hover { transform: none; }
}

/* --- Le mode de la séance, dans le bandeau ---------------------------------- */
.mode-seance {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 5px 11px;
  font-family: var(--f-ui); font-size: 11px; font-weight: 600;
  letter-spacing: .06em;
  border: 1px solid var(--bord-fort);
  border-radius: 999px;
  background: var(--surface-1);
  color: var(--texte-doux);
}
button.mode-seance { cursor: pointer; }
button.mode-seance:hover { border-color: var(--laiton); color: var(--texte); }
/* Chaque mode a sa couleur : on sait où l'on est sans lire. */
.mode-seance[data-mode="reunion"] {
  border-color: rgba(91,130,156,.45); color: var(--info);
  background: rgba(91,130,156,.1);
}
.mode-seance[data-mode="distribution"] {
  border-color: rgba(201,150,63,.45); color: var(--attn);
  background: rgba(201,150,63,.1);
}

/* --- Contrôle du matériel, côté estrade ------------------------------------- */
.controle-materiel {
  display: flex; flex-direction: column; gap: 3px;
  padding: var(--e-3) var(--e-4);
  border-bottom: 1px solid var(--bord);
  background: var(--surface-1);
}
.controle-materiel__titre {
  display: flex; align-items: center; gap: 5px;
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--texte-faible); font-weight: 600;
}
.eleve__materiel { margin-top: 3px; }
.eleve--renvoye { opacity: .5; }
.eleve--renvoye .eleve__nom { text-decoration: line-through; }

/* --- Inspection d'un cahier apporté ----------------------------------------- */
.inspection > p { display: flex; align-items: center; gap: 5px; margin-bottom: var(--e-3); }

/* --- Les renvoyés restent sous les yeux de l'estrade ------------------------ */
.renvoyes {
  margin-top: var(--e-3);
  padding: var(--e-3) var(--e-4);
  border-top: 1px solid var(--bord);
  background: rgba(180,85,78,.06);
}
.renvoyes__titre {
  display: flex; align-items: center; gap: 5px;
  margin-bottom: var(--e-2);
  font-size: 10px; letter-spacing: .14em; text-transform: uppercase;
  color: var(--alerte); font-weight: 600;
}
.renvoyes__ligne {
  display: flex; align-items: center; gap: var(--e-2);
  padding: 4px 0;
  font-size: var(--t-sm);
}

/* ---- board.css ---- */
/* ===========================================================================
   Tableau interactif
   ========================================================================= */

.tableau {
  display: flex; flex-direction: column;
  height: 100%; min-height: 0;
  background: var(--encre-1000);
}

.tableau__barre {
  display: flex; align-items: center; gap: var(--e-2);
  padding: var(--e-2) var(--e-3);
  background: var(--encre-850);
  border-bottom: 1px solid var(--ligne);
  flex-wrap: wrap;
}

.tableau__scene {
  flex: 1; min-height: 0; position: relative;
  display: grid; place-items: safe center;
  padding: var(--e-4);
  /* Quand la fenêtre devient si basse que le tableau atteint son plancher,
     mieux vaut pouvoir le faire défiler que le regarder coupé. */
  overflow: auto;
  /* Repère de mesure pour le tableau : il se taille sur la place réellement
     disponible, en largeur comme en hauteur. */
  container-type: size;
}

.tableau__surface {
  position: relative;
  border-radius: var(--r-sm);
  box-shadow: var(--ombre-3), 0 0 0 6px #241c14, 0 0 0 7px #3b2f21;
  background: #17231f;
  /* Le tableau garde ses proportions et tient entier dans la scène : sur un
     écran bas, il rapetisse au lieu de se faire couper par le bas — il n'y a
     rien à faire défiler puisque tout est là. */
  aspect-ratio: 1600 / 900;
  /* Il prend la place disponible en gardant ses proportions, sans jamais
     descendre sous une taille où l'on n'écrirait plus rien : sous ce
     plancher, la scène défile. */
  width: min(100cqw, max(100cqh * 1600 / 900, 420px));
  max-width: 100%;
}
.tableau__surface[data-fond="ardoise"] { background: #17231f; }
.tableau__surface[data-fond="craie"]   { background: #1b2430; }
.tableau__surface[data-fond="papier"]  { background: #f3ead9; }
.tableau__surface[data-fond="quadrille"] {
  background-color: #1b2430;
  background-image:
    repeating-linear-gradient(rgba(255,255,255,.05) 0 1px, transparent 1px 32px),
