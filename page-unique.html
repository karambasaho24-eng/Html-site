    repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 32px);
}

.tableau__toile {
  display: block; touch-action: none; cursor: crosshair;
  width: 100%; height: 100%;
}
.tableau__toile[data-lecture="1"] { cursor: default; }

/* Curseurs distants */
.curseurs { position: absolute; inset: 0; pointer-events: none; }
.curseur-distant {
  position: absolute; transform: translate(-2px, -2px);
  transition: left 90ms linear, top 90ms linear;
}
.curseur-distant__pointe {
  width: 10px; height: 10px; border-radius: 50% 50% 50% 0;
  transform: rotate(-45deg); border: 1.5px solid rgba(0,0,0,.4);
}
.curseur-distant__nom {
  position: absolute; left: 12px; top: 8px;
  font-size: 10px; padding: 1px 5px; border-radius: var(--r-xs);
  background: rgba(0,0,0,.6); color: #fff; white-space: nowrap;
}

/* --- Outils --------------------------------------------------------------- */
.outils {
  display: flex; align-items: center; gap: 2px;
  background: var(--encre-900);
  border: 1px solid var(--ligne);
  border-radius: var(--r-sm);
  padding: 2px;
}
.outil {
  width: 30px; height: 30px;
  display: grid; place-content: center;
  border: 0; background: none; border-radius: var(--r-xs);
  color: var(--texte-doux);
}
.outil:hover { background: var(--encre-700); color: var(--texte); }
.outil[aria-pressed="true"] { background: var(--encre-600); color: var(--laiton-clair); box-shadow: inset 0 0 0 1px var(--ligne-laiton); }
.outil svg { width: 16px; height: 16px; }

.teintes { display: flex; gap: 3px; align-items: center; }
.teinte {
  width: 20px; height: 20px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer; padding: 0;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,.35);
}
.teinte[aria-pressed="true"] { border-color: var(--texte); transform: scale(1.12); }

.epaisseurs { display: flex; gap: 2px; align-items: center; }
.epaisseur {
  width: 26px; height: 26px; display: grid; place-content: center;
  background: none; border: 0; border-radius: var(--r-xs); color: var(--texte-doux);
}
.epaisseur:hover { background: var(--encre-700); }
.epaisseur[aria-pressed="true"] { background: var(--encre-600); }
.epaisseur i { display: block; background: currentColor; border-radius: 999px; }

/* --- Pages du tableau ----------------------------------------------------- */
.pages-tableau {
  display: flex; align-items: center; gap: var(--e-1);
  overflow-x: auto; padding: 2px;
}
.page-tableau {
  min-width: 34px; height: 26px; padding: 0 var(--e-2);
  display: grid; place-content: center;
  background: var(--encre-800); border: 1px solid var(--ligne);
  border-radius: var(--r-xs);
  font-family: var(--f-mono); font-size: var(--t-xs); color: var(--texte-doux);
}
.page-tableau:hover { border-color: var(--ligne-forte); color: var(--texte); }
.page-tableau[aria-current="true"] {
  background: var(--encre-600); border-color: var(--laiton); color: var(--laiton-clair);
}

/* --- Saisie de texte sur le tableau --------------------------------------- */
.saisie-tableau {
  position: absolute; z-index: 5;
  background: rgba(0,0,0,.35);
  border: 1px dashed var(--laiton);
  color: #fff; padding: 2px 4px; min-width: 120px;
  font-family: var(--f-titre); outline: none;
}

/* ---- live.css ---- */
/* ===========================================================================
   Session en direct : salle, bandeau, panneaux, exercices
   ========================================================================= */

.salle {
  display: grid;
  /* Bandeau, puis la bande de privation — vide et haute de zéro la plupart du
     temps —, puis la salle elle-même. */
  grid-template-rows: auto auto minmax(0, 1fr);
  height: 100%;
  min-height: 0;
}

/* --- Bandeau de session --------------------------------------------------- */
.bandeau {
  display: flex; align-items: center; gap: var(--e-3);
  padding: var(--e-2) var(--e-4);
  background: linear-gradient(180deg, var(--encre-800), var(--encre-850));
  border-bottom: 1px solid var(--ligne-laiton);
  flex-wrap: wrap;
}
.bandeau__titre { font-family: var(--f-titre); font-weight: 600; font-size: var(--t-md); }
.bandeau__meta { font-size: var(--t-xs); color: var(--texte-faible); }
.bandeau__outils { margin-left: auto; display: flex; align-items: center; gap: var(--e-2); flex-wrap: wrap; }

/* --- Corps de la salle ---------------------------------------------------- */
.salle__corps {
  display: grid;
  grid-template-columns: minmax(0, 1fr) var(--l-panneau);
  min-height: 0;
}
.salle__corps--sans-panneau { grid-template-columns: minmax(0, 1fr); }
.salle__scene { min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }

.salle__panneau {
  border-left: 1px solid var(--ligne);
  background: var(--encre-850);
  display: flex; flex-direction: column;
  min-height: 0;
}
.salle__panneau-onglets {
  display: flex; border-bottom: 1px solid var(--ligne); background: var(--encre-800);
}
.salle__panneau-onglets .onglet { flex: 1; padding: var(--e-2) var(--e-1); font-size: var(--t-xs); position: relative; }
.salle__panneau-corps { flex: 1; overflow-y: auto; min-height: 0; }

.pastille-compteur {
  position: absolute; top: 3px; right: 6px;
  background: var(--oxblood); color: #fff;
  font-size: 9px; font-family: var(--f-mono);
  min-width: 14px; height: 14px; border-radius: 999px;
  display: grid; place-content: center; padding: 0 3px;
}

/* --- Chronomètre ---------------------------------------------------------- */
.chrono {
  display: inline-flex; align-items: baseline; gap: var(--e-2);
  font-family: var(--f-mono); font-size: var(--t-xl); font-weight: 600;
  background: var(--encre-900); border: 1px solid var(--ligne-forte);
  border-radius: var(--r-sm); padding: 2px var(--e-3);
  font-variant-numeric: tabular-nums;
}
.chrono[data-etat="running"] { border-color: var(--ligne-laiton); color: var(--laiton-clair); }
.chrono[data-etat="done"]    { border-color: var(--alerte); color: var(--alerte); }
.chrono__label { font-family: var(--f-ui); font-size: var(--t-xs); color: var(--texte-faible); }

/* --- Suivi du professeur -------------------------------------------------- */
.suivi {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 3px var(--e-3); border-radius: 999px;
  font-size: var(--t-xs); font-weight: 600;
  background: var(--encre-700); border: 1px solid var(--ligne-forte); color: var(--texte-doux);
}
.suivi[data-actif="1"] {
  background: rgba(201,162,39,.14); border-color: var(--ligne-laiton); color: var(--laiton-clair);
}

/* --- Élèves connectés ----------------------------------------------------- */
.eleve {
  display: flex; align-items: center; gap: var(--e-3);
  padding: var(--e-2) var(--e-3);
  border-bottom: 1px solid var(--ligne);
}
.eleve__infos { flex: 1; min-width: 0; }
.eleve__nom { font-size: var(--t-sm); font-weight: 500; }
.eleve__activite { font-size: var(--t-xs); color: var(--texte-faible); }
.eleve__activite em { font-style: normal; color: var(--laiton); }
.eleve--main-levee { background: rgba(201,162,39,.07); box-shadow: inset 2px 0 0 var(--laiton); }

/* --- Questions ------------------------------------------------------------ */
.question {
  padding: var(--e-3); border-bottom: 1px solid var(--ligne);
}
.question__entete { display: flex; align-items: center; gap: var(--e-2); margin-bottom: 4px; }
.question__corps { font-size: var(--t-sm); color: var(--texte); }
.question__reponse {
  margin-top: var(--e-2); padding: var(--e-2);
  background: var(--encre-800); border-left: 2px solid var(--olive);
  font-size: var(--t-xs); color: var(--texte-doux);
}
.question[data-statut="answered"] { opacity: .6; }

/* --- Sondage -------------------------------------------------------------- */
.sondage { padding: var(--e-4); border-bottom: 1px solid var(--ligne); }
.sondage__question { font-family: var(--f-titre); font-size: var(--t-lg); margin-bottom: var(--e-3); }
.sondage__option {
  display: block; width: 100%; text-align: left;
  padding: var(--e-2) var(--e-3); margin-bottom: 6px;
  background: var(--encre-800); border: 1px solid var(--ligne);
  border-radius: var(--r-sm); position: relative; overflow: hidden;
  font-size: var(--t-sm);
}
.sondage__option:hover { border-color: var(--ligne-forte); }
.sondage__option[aria-pressed="true"] { border-color: var(--laiton); }
.sondage__barre {
  position: absolute; inset: 0 auto 0 0;
  background: rgba(201,162,39,.16);
  transition: width 300ms ease; z-index: 0;
}
.sondage__texte { position: relative; z-index: 1; display: flex; justify-content: space-between; gap: var(--e-2); }

/* --- Annonce -------------------------------------------------------------- */
.annonce {
  border: 1px solid var(--ligne-laiton);
  border-left-width: 3px;
  background: rgba(201,162,39,.06);
  border-radius: var(--r-sm);
  padding: var(--e-3) var(--e-4);
  margin-bottom: var(--e-3);
}
.annonce[data-niveau="alert"] { border-color: var(--alerte); background: rgba(180,85,78,.07); }
.annonce__titre {
  font-size: var(--t-xs); letter-spacing: .14em; text-transform: uppercase;
  color: var(--laiton); font-weight: 700; margin-bottom: 4px;
}
.annonce__corps { font-family: var(--f-titre); font-size: var(--t-lg); }

/* --- Exercices ------------------------------------------------------------ */
.exo { max-width: 780px; margin: 0 auto; }
.exo__entete {
  border-bottom: 1px solid var(--ligne);
  padding-bottom: var(--e-3); margin-bottom: var(--e-5);
}
.exo__consigne {
  font-family: var(--f-titre); font-size: var(--t-lg);
  background: var(--encre-850); border-left: 3px solid var(--laiton);
  padding: var(--e-3) var(--e-4); border-radius: 0 var(--r-sm) var(--r-sm) 0;
  margin-bottom: var(--e-5);
}
.exo__question {
  background: var(--encre-850); border: 1px solid var(--ligne);
  border-radius: var(--r-md); padding: var(--e-4); margin-bottom: var(--e-4);
}
.exo__numero {
  font-family: var(--f-mono); font-size: var(--t-xs); color: var(--laiton);
  letter-spacing: .1em; margin-bottom: var(--e-2);
}
.exo__enonce { font-family: var(--f-titre); font-size: var(--t-lg); margin-bottom: var(--e-3); }
.exo__points { float: right; font-size: var(--t-xs); color: var(--texte-faible); font-family: var(--f-mono); }

.choix {
  display: flex; align-items: flex-start; gap: var(--e-3);
  padding: var(--e-2) var(--e-3); margin-bottom: 6px;
  border: 1px solid var(--ligne); border-radius: var(--r-sm);
  cursor: pointer; background: var(--encre-900);
  transition: border-color var(--transition), background var(--transition);
}
.choix:hover { border-color: var(--ligne-forte); }
.choix input { margin-top: 3px; accent-color: var(--laiton); }
.choix[data-selection="1"] { border-color: var(--laiton); background: rgba(201,162,39,.07); }
.choix[data-correct="1"] { border-color: var(--ok); background: rgba(111,156,106,.09); }
.choix[data-correct="0"] { border-color: var(--alerte); background: rgba(180,85,78,.08); }

.trou {
  display: inline-block; min-width: 120px;
  border: 0; border-bottom: 1px solid var(--laiton);
  background: transparent; color: var(--laiton-clair);
  padding: 0 4px; font-family: var(--f-mono);
}

/* Classement / association */
.classable {
  display: flex; align-items: center; gap: var(--e-3);
  padding: var(--e-2) var(--e-3); margin-bottom: 4px;
  background: var(--encre-900); border: 1px solid var(--ligne);
  border-radius: var(--r-sm); cursor: grab;
}
.classable:active { cursor: grabbing; }
.classable.glisse { opacity: .4; }
.classable__poignee { color: var(--texte-faible); font-size: var(--t-xs); }

.association { display: grid; grid-template-columns: 1fr auto 1fr; gap: var(--e-2) var(--e-3); align-items: center; }

/* --- Suivi de l'exercice côté professeur ---------------------------------- */
.suivi-exo { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: var(--e-2); }
.suivi-exo__eleve {
  padding: var(--e-2) var(--e-3);
  border: 1px solid var(--ligne); border-radius: var(--r-sm);
  background: var(--encre-850); font-size: var(--t-sm);
}
.suivi-exo__eleve[data-etat="submitted"] { border-color: rgba(111,156,106,.4); }
.suivi-exo__eleve[data-etat="started"]   { border-color: rgba(201,150,63,.4); }

/* --- Mode examen ---------------------------------------------------------- */
body.mode-examen .rail,
body.mode-examen .barre__outils .hors-examen { display: none; }
.bandeau-examen {
  background: var(--oxblood); color: #f6e7e5;
  padding: var(--e-2) var(--e-4);
  display: flex; align-items: center; gap: var(--e-3);
  font-size: var(--t-sm); font-weight: 600; letter-spacing: .04em;
}

/* --- Zone Roblox ---------------------------------------------------------- */
.zone-roblox {
  border: 1px dashed var(--ligne-forte);
  border-radius: var(--r-md);
  padding: var(--e-5);
  text-align: center; color: var(--texte-faible);
  background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,.012) 10px, rgba(255,255,255,.012) 20px);
}

/* --- Journal -------------------------------------------------------------- */
.journal { font-family: var(--f-mono); font-size: var(--t-xs); }
.journal__ligne {
  display: flex; gap: var(--e-3);
  padding: 5px var(--e-3);
  border-bottom: 1px solid var(--ligne);
  color: var(--texte-doux);
}
.journal__heure { color: var(--laiton); flex: 0 0 auto; }

/* --- Privation de matériel ------------------------------------------------ */
/* Un bandeau, pas une modale : on reste dans le cours, on n'en est pas sorti.
   Celui qui a oublié ses affaires assiste — c'est bien la punition. */
.privation {
  display: flex; align-items: center; gap: var(--e-3);
  padding: var(--e-2) var(--e-4);
  background: linear-gradient(180deg, rgba(139,42,42,.24), rgba(139,42,42,.12));
  border-bottom: 1px solid var(--oxblood);
  flex-wrap: wrap;
}
.privation__sceau { color: var(--alerte); display: grid; place-content: center; flex: 0 0 auto; }
.privation__dit { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }
.privation__titre { font-family: var(--f-titre); font-size: var(--t-md); }
.privation__detail { font-size: var(--t-xs); color: var(--texte-doux); }
.privation__detail b { color: var(--texte); font-variant-numeric: tabular-nums; }
.privation__refus { font-size: var(--t-xs); color: var(--alerte); }
.privation__gestes { display: flex; align-items: center; gap: var(--e-2); flex: 0 0 auto; }

.privation__ligne {
  display: flex; align-items: center; gap: var(--e-3);
  padding: var(--e-2) var(--e-3);
  border-bottom: 1px solid var(--ligne);
}
.privation__ligne--demande { background: rgba(201,162,39,.10); }
.privation__choix { display: flex; gap: 2px; flex: 0 0 auto; }

/* --- Annotations du maître ------------------------------------------------ */
/* L'encre rouge dans la marge. Elle ne remplace jamais le texte du cadet :
   elle se tient à côté, et on voit d'un coup d'œil quelle main a écrit. */
.marge { display: flex; flex-direction: column; gap: var(--e-2); min-width: 0; }
.marge__vide { font-size: var(--t-xs); color: var(--texte-faible); font-style: italic; }
.annotation {
  border-left: 2px solid var(--oxblood);
  padding: 2px var(--e-3);
  font-family: var(--f-main, var(--f-ui)); font-size: var(--t-sm);
  color: #e8b4b4;
}
.annotation[data-encre="verte"] { border-left-color: #4a7c59; color: #a8d5b5; }
.annotation[data-encre="bleue"] { border-left-color: #3b5f8a; color: #a8c4e8; }
.annotation__main { display: block; font-size: 9.5px; letter-spacing: .1em;
  text-transform: uppercase; color: var(--texte-faible); }

/* --- Mon cahier, en séance ------------------------------------------------ */
/* On écrit dans son propre cahier pendant le cours. La rangée du haut montre
   les dos de ceux qu'on a dans son sac : on choisit le sien à la couleur,
   comme on le ferait en fouillant son cartable. */
.mon-cahier { display: flex; flex-direction: column; min-height: 0; flex: 1; }
.mon-cahier__rangee {
  display: flex; align-items: center; gap: var(--e-2);
  padding: var(--e-2) var(--e-4);
  border-bottom: 1px solid var(--ligne);
  overflow-x: auto;
}
.mon-cahier__dos {
  flex: 0 0 auto;
  padding: 3px var(--e-3);
  font-size: var(--t-xs); font-family: var(--f-titre);
  color: var(--texte-doux);
  background: var(--encre-800);
  border: 1px solid var(--ligne-forte);
  border-left: 3px solid var(--laiton);
  border-radius: var(--r-xs);
  white-space: nowrap;
}
.mon-cahier__dos[data-couleur="oxblood"] { border-left-color: var(--oxblood); }
.mon-cahier__dos[data-couleur="bleu"]    { border-left-color: #3b5f8a; }
.mon-cahier__dos[data-couleur="vert"]    { border-left-color: #4a7c59; }
.mon-cahier__dos[data-couleur="olive"]   { border-left-color: #6b7040; }
.mon-cahier__dos[aria-pressed="true"] {
  color: var(--texte); background: var(--encre-700); border-color: var(--ligne-laiton);
}
.mon-cahier .cahier { flex: 1; min-height: 0; }
.marge__liste { display: flex; flex-direction: column; gap: var(--e-2); }
.marge__saisie { display: flex; flex-direction: column; gap: var(--e-2); margin-top: var(--e-2); }
.marge__pied { display: flex; gap: var(--e-2); align-items: center; }
.marge__pied .saisie { flex: 1; min-width: 0; }
/* Le cahier et sa marge côte à côte : la correction se lit en regard du
   texte, jamais à sa place. */
.inspection--annotable { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: var(--e-4); }
@media (max-width: 860px) { .inspection--annotable { grid-template-columns: 1fr; } }
.mon-cahier__gestes {
  display: flex; align-items: center; gap: var(--e-2);
  padding: var(--e-2) var(--e-4) 0;
}
/* Un dos qui n'est pas à soi : l'objet est là, mais il est d'emprunt. */
.mon-cahier__dos--emprunte {
  border-style: dashed;
  font-style: italic;
}

/* ---- responsive.css ---- */
/* ===========================================================================
   Adaptation : PC d'abord (cohabitation Roblox), puis tablette, puis mobile
   ========================================================================= */

@media (max-width: 1180px) {
  .colonnes { grid-template-columns: 1fr; }
  .salle__corps { grid-template-columns: 1fr 280px; }
}

@media (max-width: 980px) {
  :root { --l-rail: 60px; }
  .marque__nom, .rail__lien span:not(.compteur), .rail__titre { display: none; }
  .rail__lien { justify-content: center; padding: 10px 0; }
  .marque { justify-content: center; padding: 0; }

  .salle__corps { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
  .salle__panneau { border-left: 0; border-top: 1px solid var(--ligne); max-height: 46dvh; }
  .cahier { grid-template-columns: 1fr; }
  .tranche { display: none; }
  .cahier.tranche-ouverte { grid-template-columns: 200px 1fr; }
  .cahier.tranche-ouverte .tranche { display: flex; }
  .grille--fixe2 { grid-template-columns: 1fr; }
}

@media (max-width: 720px) {
  :root { --l-rail: 0px; --h-barre: 48px; }
  .chassis { grid-template-columns: 1fr; grid-template-areas: "barre" "vue"; }
  .marque { display: none; }

  /* Rail transformé en tiroir */
  .rail {
    position: fixed; inset: 0 auto 0 0; z-index: 150;
    width: 248px; transform: translateX(-100%);
    transition: transform 180ms cubic-bezier(.2,.8,.3,1);
    box-shadow: var(--ombre-3);
  }
  body.tiroir-ouvert .rail { transform: none; }
  body.tiroir-ouvert::after {
    content: ""; position: fixed; inset: 0; z-index: 140; background: var(--voile);
  }
  .rail__lien span:not(.compteur), .rail__titre { display: block; }
  .rail__lien { justify-content: flex-start; padding: 9px var(--e-4); }

  .page { padding: var(--e-4) var(--e-4) var(--e-6); }
  .page__entete { flex-direction: column; align-items: stretch; }
  .parchemin { padding: var(--e-4) var(--e-4) var(--e-5) calc(var(--e-4) + 22px); min-height: 400px; }
  .parchemin::before { left: 16px; }
  .modale { max-height: 92dvh; }
  .calque-toasts { left: var(--e-3); right: var(--e-3); max-width: none; }
  .tableau__barre { gap: var(--e-1); }
  .stats { grid-template-columns: repeat(2, 1fr); }
  .btn { min-height: 36px; }
}

@media (max-width: 460px) {
  .grille--2, .grille--3, .grille--4 { grid-template-columns: 1fr; }
  .code-classe--grand { font-size: var(--t-2xl); }
}

/* Impression : le cahier seul, sur parchemin clair */
@media print {
  .rail, .barre, .marque, .tranche, .feuillet__barre, .calque-toasts { display: none !important; }
  .chassis { display: block; height: auto; }
  .parchemin { box-shadow: none; border: 0; background: #fff; }
  body { background: #fff; }
}

/* ---------------------------------------------------------------------------
   Correctifs d'encombrement : aucune grille ne doit déborder horizontalement.
   ------------------------------------------------------------------------- */
@media (max-width: 720px) {
  .chassis { grid-template-columns: minmax(0, 1fr); }
  .barre { padding: 0 var(--e-2); gap: 1px; }
  .barre__fil { flex: 1 1 0; min-width: 0; font-size: var(--t-xs); }
  .barre__outils { flex: 0 0 auto; }
  .reseau .petit { display: none; }
  .reseau { padding: 2px 4px; }
  .page__entete, .page__titre, .page__actions { min-width: 0; max-width: 100%; }
  .page__actions { width: 100%; }
  .page__actions .btn { flex: 1 1 140px; }
  .colonnes, .grille--2, .grille--3 { grid-template-columns: minmax(0, 1fr); }
  .salle__corps { grid-template-columns: minmax(0, 1fr); }
  .bandeau { gap: var(--e-2); }
  .bandeau__outils { width: 100%; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .code-classe { letter-spacing: .12em; font-size: var(--t-lg); }
}

@media (max-width: 460px) {
  .barre__fil { display: none; }
}


/* Page autonome : on s'aligne sur la hauteur réellement disponible, le cadre
   d'accueil réservant déjà les marges de sécurité de l'appareil. */
html, body { height: 100%; }
body { margin: 0; font-family: var(--f-ui); }
.chassis { height: 100%; }

 * (netlify.toml, `script-src 'self'`) refuse le code écrit dans la page. Un
 * garde-fou bloqué par la CSP ne garde plus rien — et c'est précisément dans

// même si les modules ne se chargent pas du tout.
(function () {
  var DELAI = 10000;
  setTimeout(function () {
    var ecran = document.getElementById("ecran-chargement");
    if (!ecran || !ecran.isConnected) return;
    var app = document.getElementById("application");
    if (app && !app.hidden) return;

    var causes = [];

    var boite = document.createElement("div");

      + "font-family:system-ui,sans-serif;color:#e6e2d8;line-height:1.6";

      + "L'application n'a pas pu démarrer</div>"
      + '<p style="color:#a9a396;margin:0 0 14px">'
      + (causes.length
          ? "Cause probable : " + causes.join(", ") + "."
          : "Les fichiers de l'application n'ont pas pu être chargés.")
      + "</p>"
      + '<p style="color:#746e63;font-size:.85rem;margin:0 0 18px">'
      + "Essayez de recharger, ou d'ouvrir la page dans un onglet normal "
      + "plutôt qu'en navigation privée.</p>";

    bouton.style.cssText = "background:#c9a227;color:#1a1508;border:0;"

    bouton.onclick = function () { location.reload(); };
    boite.appendChild(bouton);
    ecran.appendChild(boite);
  }, DELAI);
})();
  

</script>

      const decalageY = e.clientY - depart.top;

  async function poserFondImage(pageCourante, genre) {
    const entree = el("input", {
      type: "file",
      accept: genre === "pdf" ? "application/pdf" : "image/*"
    });
    entree.click();
    const fichier2 = await new Promise((resoudre2) => {
      entree.onchange = () => resoudre2(entree.files?.[0] || null);
      window.addEventListener(
        "focus",
        () => setTimeout(() => resoudre2(entree.files?.[0] || null), 400),
        { once: true }
      );
    });
    if (!fichier2) return;
    let source;
    try {
      if (genre === "pdf") {
        const total = await compterPagesPdf(fichier2);
        const choix = total > 1 ? await formulaire({
          titre: "Quelle page ?",
          champs: [{
            cle: "page",
            label: `Page (1 \xE0 ${total})`,
            type: "number",
            valeur: 1,
            min: 1,
            max: total
          }],
          libelle: "Poser"
        }) : { page: 1 };
        if (!choix) return;
        const numero = Math.max(1, Math.min(total, Number(choix.page) || 1));
        toast("Conversion de la page\u2026");
        const images = await pdfEnImages(fichier2, { pagesVoulues: [numero], echelle: 2 });
        source = images[0];
      } else {
        source = await new Promise((resoudre2, rejeter) => {
          const lecteur = new FileReader();
          lecteur.onload = () => resoudre2(lecteur.result);
          lecteur.onerror = () => rejeter(lecteur.error);
          lecteur.readAsDataURL(fichier2);
        });
      }
    } catch (err) {
      erreur("Conversion impossible", messageErreur(err));
      return;
    }
    if (!source) return;
    try {
      await tableaux.majorerPage(pageCourante.id, { background_image: source });
      pageCourante.background_image = source;
      await moteurTableau.definirImageFond(source);
      succes(genre === "pdf" ? "Page pos\xE9e au tableau" : "Image pos\xE9e au tableau");
    } catch (err) {
      erreur("Impossible de poser cette image", messageErreur(err));
    }
  }
  async function retirerFondImage(pageCourante) {

      toast("Connexion r\xE9tablie", { type: "ok" });
      emettre("reseau:retabli");
    }
  }
}

function declarerRaccourcis() {

  enregistrerAction("cahier.ouvrir", () => {
    const dernier = etat.cahiers?.[0];
    aller(dernier ? `/cahier/${dernier.id}` : "/cahiers");
  });
  enregistrerAction("tableau.ouvrir", () => {
    if (etat.classeActive) aller(`/classe/${etat.classeActive.id}/salle`);
    else aller("/classes");
  });
}
async function demarrer() {
  const ecran = document.getElementById("ecran-chargement");
  const hote = document.getElementById("application");
  try {
    restaurerInterface();
    await initialiserDonnees();
    if (pilote.repli) {
      toast("Projet Supabase injoignable", {
        corps: "Bascule en mode d\xE9monstration locale. V\xE9rifiez la configuration dans R\xE9glages.",
        type: "attn",
        duree: 9e3
      });
    }
    await chargerSession();
    hote.hidden = false;
    const vue = construireChassis(hote);
    declarerRoutes();
    declarerRaccourcis();
    activerRaccourcis();
    surveillerReseau();
    demarrerRouteur(vue, {
      rendu: (noeud) => render(vue, noeud)
    });
    auth.surChangement(async (evenement) => {
      if (evenement === "SIGNED_OUT") {
        definir({ utilisateur: null, profil: null, classes: [], notifications: [] });
        aller("/connexion");
      } else if (evenement === "SIGNED_IN" || evenement === "TOKEN_REFRESHED") {
        if (!etat.utilisateur) {
          await chargerSession();
          const retour = stockageSession.getItem("ojm.retour");
          stockageSession.removeItem("ojm.retour");
          aller(retour ? retour.replace(/^#/, "") : "/");
        }
      }
    });
    setInterval(() => {
      if (document.visibilityState === "visible" && etat.utilisateur) rafraichirNotifications();
    }, 9e4);
    definir({ pret: true });
    ecran?.remove();
    if (!etat.utilisateur && !location.hash.startsWith("#/connexion")) {
      aller("/connexion", true);
    }
  } catch (err) {
    console.error("[amor\xE7age]", err);
    ecran?.remove();
    hote.hidden = false;
    render(hote, ecranPanne(err));
  }
}
function ecranPanne(err) {
  return el(
    "div.page",
    el(
      "div.page__entete",
      el(
        "div.page__titre",
        el("span.page__surtitre", "Panne au d\xE9marrage"),
        el("h1", "L'acad\xE9mie n'a pas pu s'ouvrir")
      )
    ),
    el(
      "div.carte",
      el("p", "Une erreur est survenue pendant l'initialisation :"),
      el("pre.mono.petit", { style: { whiteSpace: "pre-wrap", color: "var(--alerte)" } }, String(err?.message || err)),
      el("p.doux.petit", "V\xE9rifiez la configuration Supabase dans config.js, ou relancez en mode d\xE9monstration en laissant les champs vides."),
      el(
        "div.ligne-flex",
        el("button.btn.btn--primaire", { onclick: () => location.reload() }, "Recharger"),
        el("button.btn", {
          onclick: () => {
            try {
              stockageLocal.removeItem("ojm.config");
            } catch {
            }
            location.reload();
          }
        }, "R\xE9initialiser la configuration locale")
      )
    )
  );
}
window.addEventListener("unhandledrejection", (evenement) => {
  console.error("[promesse]", evenement.reason);
  if (etat.pret) erreur("Une action a \xE9chou\xE9", evenement.reason?.message);
});
ecouter("route:erreur", ({ erreur: err }) => {
  render(zoneVue(), el(
    "div.page",

      el("p", String(err?.message || err)),
      el("button.btn", { onclick: () => resoudre() }, "R\xE9essayer")
    )
  ));
});
